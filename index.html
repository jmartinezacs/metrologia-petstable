/* Barras de desplazamiento acordes al sitio */
html { scrollbar-color: #7E22CE var(--soft); scrollbar-width: thin; }
.sidebar, .modal-body, .table-wrap, .combo-list, .tabs { scrollbar-width: thin; scrollbar-color: rgba(126, 34, 206, .8) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--soft); }
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #7E22CE, #9333EA); border-radius: 999px; border: 2px solid var(--soft); }
::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #6B21A8, #7E22CE); }
::-webkit-scrollbar-corner { background: transparent; }
.sidebar { scrollbar-color: rgba(126, 34, 206, .8) #090D12; }
.sidebar::-webkit-scrollbar-track { background: #090D12; }
.sidebar::-webkit-scrollbar-thumb { border-color: #090D12; }
.modal-body::-webkit-scrollbar-track, .table-wrap::-webkit-scrollbar-track, .combo-list::-webkit-scrollbar-track { background: transparent; }
.modal-body::-webkit-scrollbar-thumb, .table-wrap::-webkit-scrollbar-thumb, .combo-list::-webkit-scrollbar-thumb { border-color: var(--card); }

/* Botones flotantes */
.fabs { position: fixed; right: 24px; bottom: 24px; z-index: 450; display: flex; flex-direction: column; gap: 16px; }
.fab { position: relative; width: 58px; height: 58px; border-radius: 50%; border: 0; color: #fff; display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 10px 26px rgba(9, 13, 18, .28); transition: transform .15s, box-shadow .15s; }
.fab svg { width: 26px; height: 26px; }
.fab-cita { background: linear-gradient(135deg, #7E22CE, #9333EA); }
.fab-home { background: linear-gradient(135deg, #0B2235, #1B3A55); border: 2px solid rgba(27, 199, 199, .6); }
.fab:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 0 0 4px rgba(126, 34, 206, .25), 0 12px 30px rgba(126, 34, 206, .45); }
.fab-tip { position: absolute; right: calc(100% + 12px); top: 50%; transform: translateY(-50%); white-space: nowrap; background: #102536; color: #fff; font-size: 12px; font-weight: 800;
  padding: 7px 11px; border-radius: 9px; opacity: 0; pointer-events: none; transition: opacity .15s; box-shadow: 0 8px 20px rgba(0, 0, 0, .2); }
.fab:hover .fab-tip, .fab:focus-visible .fab-tip { opacity: 1; }
.content { padding-bottom: 120px; }
.toasts { right: 100px; }
body.menu-open .fabs { display: none; }
@media (max-width: 720px) {
  .fabs { right: 14px; bottom: calc(78px + env(safe-area-inset-bottom)); gap: 12px; }
  .fab { width: 52px; height: 52px; }
  .fab svg { width: 23px; height: 23px; }
  .fab-tip { display: none; }
  .content { padding-bottom: calc(210px + env(safe-area-inset-bottom)); }
  .toasts { top: calc(var(--header-h) + 10px); bottom: auto; left: 12px; right: 12px; }
}
@media print { .fabs { display: none !important; } }

/* =====================================================================
   v1.3 · Login de una sola pantalla, logo mayor, barras de desplazamiento
   en el color del encabezado, disponibilidad, padecimientos y avisos
   ===================================================================== */
/* ---------- Login: todo visible sin desplazarse ---------- */
.login { position: relative; display: flex; align-items: center; justify-content: center; height: 100vh; height: 100dvh; min-height: 0; overflow: hidden;
  background: linear-gradient(160deg, #0B2235 0%, #07131E 60%, #090D12 100%); padding: 12px 16px; }
.login-glow { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; pointer-events: none; }
.login-glow.g1 { width: 46vmax; height: 46vmax; left: -14vmax; bottom: -18vmax; background: rgba(27, 199, 199, .45); }
.login-glow.g2 { width: 40vmax; height: 40vmax; right: -12vmax; top: -16vmax; background: rgba(126, 34, 206, .5); }
.login-wrap { position: relative; z-index: 1; width: min(420px, 100%); max-height: 100%; display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 2vh, 16px); }
.login-logo { width: clamp(96px, 16vh, 140px); height: clamp(76px, 12.7vh, 111px); }
.login-card { width: 100%; text-align: center; padding: clamp(16px, 3vh, 28px) clamp(18px, 4vw, 30px); border-radius: 22px;
  background: var(--card); border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0, 0, 0, .35); }
.login-card .app-icon { width: clamp(44px, 7vh, 60px); height: clamp(44px, 7vh, 60px); border-radius: 15px; display: block; margin: 0 auto; box-shadow: 0 8px 20px rgba(126, 34, 206, .3); }
.login-card h1 { margin: clamp(6px, 1.4vh, 12px) 0 2px; font-size: clamp(20px, 3.2vh, 26px); letter-spacing: -.02em; color: var(--text); }
.login-sub { margin: 0 0 clamp(8px, 2vh, 16px); color: var(--muted); font-size: 12.5px; }
.login-card .field { margin: clamp(5px, 1.2vh, 10px) 0; text-align: center; }
.login-card .field label { text-align: center; }
.login-card .field input { text-align: center; min-height: clamp(40px, 5.6vh, 46px); }
.login-card .pw-wrap input { padding-left: 46px !important; }
.login-card .login-options { flex-direction: column; justify-content: center; gap: 4px; margin: clamp(4px, 1vh, 8px) 0 clamp(8px, 1.6vh, 14px); }
.login-card .btn.lg { min-height: clamp(42px, 6vh, 48px); }
.login-chips { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: clamp(8px, 1.8vh, 14px); }
.login-chips span { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--muted); background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 4px 9px; }
.login-chips svg { width: 13px; height: 13px; color: var(--orange); }
.login-foot { color: #7E93A3; font-size: 11px; }
.login .login-msg { text-align: center; }
@media (max-height: 640px) { .login-chips, .login-foot { display: none; } .login-card .login-options { flex-direction: row; justify-content: space-between; } }
@media (max-height: 540px) { .login-logo, .login-card .app-icon { display: none; } }

/* ---------- Logo del encabezado más grande ---------- */
.top-logo { height: 52px; width: 66px; }
@media (max-width: 720px) { .top-logo { height: 40px; width: 50px; } }

/* ---------- Barras de desplazamiento en el color del encabezado ---------- */
html { scrollbar-color: #1B2A36 var(--soft); }
.sidebar, .modal-body, .table-wrap, .combo-list, .tabs { scrollbar-color: #2A3B49 transparent; }
::-webkit-scrollbar-thumb { background: #1B2A36; border: 2px solid var(--soft); }
::-webkit-scrollbar-thumb:hover { background: #090D12; }
.sidebar { scrollbar-color: #2D3D4B #090D12; }
.sidebar::-webkit-scrollbar-thumb { background: #2D3D4B; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) ::-webkit-scrollbar-thumb { background: #2D4253; } :root:not([data-theme="light"]) { scrollbar-color: #2D4253 var(--soft); } }
:root[data-theme="dark"] ::-webkit-scrollbar-thumb { background: #2D4253; }
:root[data-theme="dark"] { scrollbar-color: #2D4253 var(--soft); }

/* ---------- Cambio de tema inmediato ---------- */
body { transition: none; }

/* ---------- Disponibilidad de citas en el panel ---------- */
.avail { position: relative; overflow: hidden; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 22px; align-items: center; padding: 20px 24px; border-radius: 20px; margin-bottom: 16px;
  border: 1px solid var(--line); box-shadow: var(--shadow); background: var(--card); }
.avail::before { content: ""; position: absolute; inset: 0; background: radial-gradient(500px 200px at 0% 50%, rgba(22, 163, 74, .14), transparent 70%); pointer-events: none; }
.avail.lleno::before { background: radial-gradient(500px 200px at 0% 50%, rgba(220, 38, 38, .12), transparent 70%); }
.avail.cerrado::before { background: radial-gradient(500px 200px at 0% 50%, rgba(27, 199, 199, .14), transparent 70%); }
.avail-ring { position: relative; width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(#16A34A calc(var(--p) * 1%), var(--soft) 0); }
.avail.lleno .avail-ring { background: conic-gradient(#DC2626 calc(var(--p) * 1%), var(--soft) 0); }
.avail.cerrado .avail-ring { background: conic-gradient(#1BC7C7 calc(var(--p) * 1%), var(--soft) 0); }
.avail-ring::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--card); }
.avail-ring b { position: relative; z-index: 1; font-size: 26px; line-height: 1; text-align: center; }
.avail-ring small { display: block; font-size: 9.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.avail-txt { position: relative; min-width: 0; }
.avail-tag { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; color: #fff; font-weight: 900; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; background: #16A34A; }
.avail-tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: blink 1.2s ease-in-out infinite; }
.avail.lleno .avail-tag { background: #DC2626; }
.avail.cerrado .avail-tag { background: #0891B2; }
.avail-txt h3 { margin: 8px 0 4px; font-size: 19px; letter-spacing: -.01em; }
.avail-txt p { margin: 0; color: var(--muted); font-size: 12px; }
.avail-slots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.avail-slots button { border: 1px solid rgba(22, 163, 74, .4); background: rgba(22, 163, 74, .1); color: #15803D; font-weight: 800; font-size: 12px; padding: 5px 10px; border-radius: 9px; font-variant-numeric: tabular-nums; }
:root[data-theme="dark"] .avail-slots button { color: #4ADE80; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .avail-slots button { color: #4ADE80; } }
.avail-slots .more { color: var(--muted); font-size: 12px; align-self: center; }
.avail-cta { position: relative; }
@media (max-width: 760px) {
  .avail { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; gap: 12px; }
  .avail-slots { justify-content: center; }
}

/* ---------- Estadísticas por padecimiento ---------- */
.dept-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.total-badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; padding: 4px 11px; border-radius: 999px; background: #0B2235; color: #fff; font-weight: 900; font-size: 11.5px; }
.total-badge b { color: #D8B4FE; font-size: 13px; }
.section-label { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 24px 0 12px; font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: .12em; color: var(--text); }
.section-label::before, .section-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* ---------- Avisos / notificaciones ---------- */
.notif-banner { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; margin-bottom: 16px; background: linear-gradient(135deg, rgba(126, 34, 206, .12), rgba(27, 199, 199, .1)); border: 1px solid rgba(126, 34, 206, .35); }
.notif-banner .nb-ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: #7E22CE; color: #fff; flex: 0 0 auto; }
.notif-banner .nb-txt { flex: 1; min-width: 0; }
.notif-banner b { display: block; font-size: 13.5px; }
.notif-banner span { color: var(--muted); font-size: 12px; }
@media (max-width: 600px) { .notif-banner { flex-wrap: wrap; justify-content: center; text-align: center; } }

/* Galería de fotos existentes */
.photo-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 10px; max-height: 50vh; overflow-y: auto; padding: 4px; }
.photo-gallery button { border: 2px solid transparent; background: var(--soft); border-radius: 14px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.photo-gallery button:hover, .photo-gallery button.sel { border-color: var(--orange); }
.photo-gallery img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }
.photo-gallery span { font-size: 10.5px; color: var(--text); text-align: center; overflow-wrap: anywhere; }
.acc-results { display: grid; gap: 6px; margin-top: 8px; max-height: 260px; overflow-y: auto; }
.acc-results button { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 10px; color: var(--text); }
.acc-results button:disabled { opacity: .55; cursor: not-allowed; }
.acc-results .acc-main { flex: 1; min-width: 0; }
.acc-results b { display: block; font-size: 12.5px; }
.acc-results small { color: var(--muted); font-size: 11px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--soft); }
.switch-row input { width: 20px; height: 20px; accent-color: var(--orange); }
.acc-results button.sel { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(126, 34, 206, .18); }

/* =====================================================================
   v1.4 · Menús desplegables propios, tabla de usuarios, urgencias
   ===================================================================== */
/* ---------- Menús desplegables (select / sugerencias) ---------- */
.cs { position: relative; display: block; width: 100%; min-width: 0; }
.toolbar .cs { display: inline-block; width: auto; min-width: 150px; flex: 0 1 auto; }
.pager .cs { width: auto; min-width: 130px; }
.cs-native { position: absolute !important; inset: 0; width: 100% !important; height: 100% !important; opacity: 0 !important; pointer-events: none !important; }
.cs-btn { width: 100%; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 12px 0 14px;
  border: 1px solid var(--input-line); border-radius: 11px; background: var(--input); color: var(--text); font-size: 13.5px; font-weight: 600; text-align: left;
  transition: border-color .12s, box-shadow .12s; cursor: pointer; }
.toolbar .cs-btn { min-height: 40px; font-size: 12.5px; border-radius: 10px; }
.pager .cs-btn { min-height: 34px; font-size: 12px; border-radius: 9px; }
.cs-btn:hover:not(:disabled) { border-color: var(--orange) !important; box-shadow: 0 0 0 3px rgba(126, 34, 206, .14) !important; }
.cs-btn:focus-visible, .cs-btn[aria-expanded="true"] { outline: none; border-color: var(--turq); box-shadow: 0 0 0 3px rgba(27, 199, 199, .18); }
.cs-btn:disabled { opacity: .6; cursor: not-allowed; }
.cs-val { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cs-val.ph { color: var(--muted); font-weight: 500; }
.cs-chev { flex: 0 0 auto; color: var(--orange); transition: transform .15s; }
.cs-btn[aria-expanded="true"] .cs-chev { transform: rotate(180deg); }
.field.invalid .cs-btn { border-color: var(--bad); box-shadow: 0 0 0 3px rgba(224, 70, 78, .1); }
.cs-panel { position: fixed; z-index: 3000; max-height: 300px; overflow-y: auto; padding: 6px; border-radius: 14px; background: var(--card);
  border: 1px solid var(--line); box-shadow: 0 18px 44px rgba(9, 13, 18, .25); animation: pop .12s ease; scrollbar-width: thin; }
.cs-opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 11px; border-radius: 9px; font-size: 13px; color: var(--text); cursor: pointer; }
.cs-opt.ph { color: var(--muted); }
.cs-opt.hl { background: var(--soft); }
.cs-opt.sel { background: rgba(126, 34, 206, .12); color: #6B21A8; font-weight: 800; }
:root[data-theme="dark"] .cs-opt.sel { color: #D8B4FE; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cs-opt.sel { color: #D8B4FE; } }
.cs-opt.sel svg { color: var(--orange); flex: 0 0 auto; }
.cs-opt.dis { opacity: .45; cursor: not-allowed; }
.cs-dl { position: relative; }

/* ---------- Tabla de usuarios: fotos alineadas, campana y puesto ---------- */
.table th.col-user, .table td.col-user { text-align: left; padding-left: 22px; }
.table td.col-user .user-cell { justify-content: flex-start; }
.user-photo { position: relative; flex: 0 0 auto; display: inline-flex; }
.user-txt { min-width: 0; }
.bell-badge { position: absolute; right: -7px; bottom: -5px; width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center;
  background: var(--card); box-shadow: 0 2px 7px rgba(9, 13, 18, .25); animation: bellSwing 2.4s ease-in-out infinite; transform-origin: 50% 20%; }
@keyframes bellSwing { 0%, 70%, 100% { transform: rotate(0); } 75% { transform: rotate(14deg); } 82% { transform: rotate(-12deg); } 89% { transform: rotate(6deg); } }
.puesto-txt { font-size: 11.5px; font-weight: 800; color: var(--text); }
@media (max-width: 720px) { .table-wrap.responsive td.col-user { padding-left: 10px; text-align: right; } .table-wrap.responsive td.col-user .user-cell { justify-content: flex-end; } }

/* ---------- Citas de urgencia ---------- */
.urg-switch { margin-bottom: 10px; border-color: rgba(220, 38, 38, .35); background: rgba(220, 38, 38, .06); cursor: pointer; }
.urg-switch b { display: inline-flex; align-items: center; gap: 6px; color: #B91C1C; }
:root[data-theme="dark"] .urg-switch b { color: #FCA5A5; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .urg-switch b { color: #FCA5A5; } }
.urg-switch input { accent-color: #DC2626; }
.urg-btn { background: linear-gradient(135deg, #DC2626, #F87171); color: #fff; box-shadow: 0 7px 16px rgba(220, 38, 38, .22); margin-top: 8px; }
.avail-cta { display: flex; flex-direction: column; align-items: stretch; }
.agenda-slot.urg { border-color: rgba(220, 38, 38, .4); background: rgba(220, 38, 38, .05); }

/* =====================================================================
   v1.5 · Pantalla de acceso siempre en modo oscuro
   (independiente del tema elegido dentro del sitio)
   ===================================================================== */
.login {
  --card: #0D1B26; --soft: #122431; --text: #EEF3F7; --muted: #93A5B3; --line: #213443;
  --input: #0F202C; --input-line: #2A4152; --bad: #FF8A90; --bad-bg: rgba(255, 138, 144, .12); --bad-line: rgba(255, 138, 144, .32);
  --info: #5FE0E0; --info-bg: rgba(95, 224, 224, .12); --info-line: rgba(95, 224, 224, .3);
  color-scheme: dark; color: var(--text);
}
.login .login-card { background: rgba(13, 27, 38, .92); border-color: rgba(255, 255, 255, .08); backdrop-filter: blur(6px); box-shadow: 0 24px 60px rgba(0, 0, 0, .5); }
.login .field label { color: #B9C8D3; }
.login .field input { color: var(--text); }
.login .field input::placeholder { color: #6F8697; }
.login .check { color: #B9C8D3; }
.login .link-btn { color: #5FE0E0; }
.login .pw-toggle { color: #93A5B3; }
.login-chips span { background: rgba(255, 255, 255, .05); border-color: rgba(255, 255, 255, .1); color: #B9C8D3; }
/* Autocompletado del navegador sin fondo claro */
.login input:-webkit-autofill, .login input:-webkit-autofill:hover, .login input:-webkit-autofill:focus {
  -webkit-text-fill-color: #EEF3F7; caret-color: #EEF3F7;
  -webkit-box-shadow: 0 0 0 1000px #0F202C inset; box-shadow: 0 0 0 1000px #0F202C inset; transition: background-color 9999s;
}

/* ===================== v1.6 ===================== */
[hidden] { display: none !important; }
.login-foot a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
.login-foot a:hover { color: var(--orange); }
.login-foot a::before { content: '·'; display: inline-block; margin: 0 6px; text-decoration: none; }

/* Agenda: horarios sin servicio */
.agenda-slot.blocked { background: repeating-linear-gradient(135deg, var(--soft), var(--soft) 8px, transparent 8px, transparent 16px); border-style: dashed; color: var(--muted); }
.agenda-slot.blocked b { color: var(--warn); }

/* Agenda semanal */
.wk-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 12px; }
.wk-grid { display: grid; grid-template-columns: 62px repeat(5, minmax(118px, 1fr)); min-width: 660px; }
.wk-grid > div { border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); min-height: 38px; }
.wk-grid > div:nth-child(6n + 1) { border-left: 0; }
.wk-head { position: sticky; top: 0; z-index: 1; background: var(--soft); padding: 8px 6px; text-align: center; font-weight: 700; font-size: 12.5px; display: flex; flex-direction: column; gap: 2px; align-items: center; justify-content: center; }
.wk-head .link-btn { font-weight: 800; color: var(--text); }
.wk-head.today { background: var(--orange-soft); }
.wk-head.today .link-btn { color: var(--orange); }
.wk-off { color: var(--warn); font-weight: 600; font-size: 11px; line-height: 1.2; }
.wk-hora { display: flex; align-items: center; justify-content: center; font-size: 11.5px; color: var(--muted); background: var(--soft); }
.wk-cell { padding: 4px; display: flex; flex-direction: column; gap: 3px; justify-content: center; }
.wk-cell.past { background: var(--soft); opacity: .55; }
.wk-cell.off { background: repeating-linear-gradient(135deg, var(--soft), var(--soft) 6px, transparent 6px, transparent 12px); }
.wk-cell.busy span { font-size: 11px; color: var(--muted); text-align: center; }
.wk-cell.free button { width: 100%; height: 100%; min-height: 28px; border: 1px dashed transparent; border-radius: 8px; background: transparent; color: transparent; cursor: pointer; display: grid; place-items: center; }
.wk-cell.free button svg { width: 15px; height: 15px; }
.wk-cell.free:hover button, .wk-cell.free button:focus-visible { border-color: var(--turq); color: var(--turq-strong); background: var(--turq-soft); }
.wk-chip { display: block; width: 100%; text-align: left; border: 0; border-left: 3px solid var(--gray); border-radius: 7px; padding: 4px 6px; font: inherit; font-size: 11.5px; font-weight: 600; line-height: 1.25; background: var(--gray-bg); color: var(--text); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wk-chip:hover { filter: brightness(.97); box-shadow: 0 0 0 2px var(--orange-soft); }
.wk-chip.st-pendiente { border-left-color: var(--warn); background: var(--warn-bg); }
.wk-chip.st-confirmada { border-left-color: var(--info); background: var(--info-bg); }
.wk-chip.st-atendida { border-left-color: var(--ok); background: var(--ok-bg); }
.wk-chip.st-no_asistio { border-left-color: var(--bad); background: var(--bad-bg); }
.wk-chip.urg { box-shadow: inset 0 0 0 1px var(--bad-line); }

/* Historial por colaborador */
.hist-list { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.hist-item { border: 1px solid var(--line); border-left: 4px solid var(--gray-line); border-radius: 12px; padding: 10px 12px; background: var(--card); }
.hist-item.st-atendida { border-left-color: var(--ok); }
.hist-item.st-no_asistio { border-left-color: var(--bad); }
.hist-item.st-confirmada, .hist-item.st-pendiente { border-left-color: var(--info); }
.hist-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.hist-head .link-btn { font-weight: 800; color: var(--orange); }
.hist-body { margin-top: 6px; font-size: 13px; }
.hist-body p { margin: 4px 0 0; }
.hist-body small { color: var(--muted); font-weight: 700; }

/* Reportes */
.report-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 14px; }
.report-card { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
.report-card p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
.report-card .btn { grid-column: 1 / -1; justify-self: start; }
.report-ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--orange-soft); color: var(--orange); }
.card-head h3 svg { width: 18px; height: 18px; vertical-align: -3px; color: var(--orange); }

/* Aviso de nueva versión */
.update-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 600; display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 16px; border-radius: 999px; background: #0D1B26; color: #EEF3F7; box-shadow: var(--shadow-lg); font-size: 13px; max-width: calc(100vw - 32px); }
.update-bar > svg { color: #FFC163; flex: 0 0 auto; }
.update-bar .icon-btn { color: #B9C8D3; }
@media (max-width: 760px) {
  .update-bar { left: 12px; right: 12px; transform: none; max-width: none; bottom: auto; top: calc(var(--header-h) + 8px + env(safe-area-inset-top)); border-radius: 16px; padding: 8px 8px 8px 12px; font-size: 12.5px; }
  .update-bar > span { flex: 1 1 auto; min-width: 0; }
  .wk-grid { grid-template-columns: 50px repeat(5, minmax(96px, 1fr)); min-width: 530px; }
}

/* Constancia de atención (solo al imprimir) */
#print-area { display: none; }
@media print {
  body.printing > *:not(#print-area) { display: none !important; }
  body.printing { background: #fff !important; }
  body.printing #print-area { display: block; color: #111; font-family: var(--font); font-size: 12pt; padding: 10mm 6mm; }
  #print-area .pc-head { display: flex; gap: 16px; align-items: center; border-bottom: 3px solid #7E22CE; padding-bottom: 12px; margin-bottom: 20px; }
  #print-area .pc-logo { width: 110px; height: 80px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #print-area h1 { margin: 0; font-size: 20pt; color: #0B1E2D; }
  #print-area .pc-head p { margin: 4px 0 0; color: #555; }
  #print-area .pc-text { line-height: 1.6; }
  #print-area .pc-table { border-collapse: collapse; margin: 14px 0; min-width: 60%; }
  #print-area .pc-table th, #print-area .pc-table td { border: 1px solid #bbb; padding: 7px 10px; text-align: left; }
  #print-area .pc-table th { background: #f3f3f3; width: 45%; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #print-area .pc-note { font-size: 10pt; color: #555; }
  #print-area .pc-firmas { display: flex; gap: 40px; margin-top: 70px; }
  #print-area .pc-firmas div { flex: 1; text-align: center; display: flex; flex-direction: column; gap: 4px; }
  #print-area .pc-firmas span { border-top: 1px solid #333; margin-bottom: 6px; }
  #print-area .pc-firmas small { color: #666; }
  #print-area .pc-foot { margin-top: 40px; font-size: 9pt; color: #777; }
}

/* ===================== v1.8 ===================== */
/* Nivel restante de un envase (gel, crema, frasco, rollo) */
.nivel-seg { display: flex; flex-wrap: wrap; gap: 6px; }
.nivel-seg label { position: relative; }
.nivel-seg input { position: absolute; opacity: 0; pointer-events: none; }
.nivel-seg span { display: inline-flex; align-items: center; min-height: 34px; padding: 6px 14px; border: 1px solid var(--input-line); border-radius: 999px; background: var(--input); color: var(--text); font-weight: 700; font-size: 13px; cursor: pointer; }
.nivel-seg span:hover { border-color: var(--turq); }
.nivel-seg input:checked + span { background: var(--turq-soft); border-color: var(--turq); color: var(--turq-strong); }
.nivel-seg .fin input:checked + span { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad); }
.nivel-seg input:focus-visible + span { outline: 2px solid var(--orange); outline-offset: 2px; }
.nivel-seg input:disabled + span { opacity: .5; cursor: default; }
/* Alta de artículo: forma de llevar el inventario y clave automática */
.opt-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.opt-cards label { position: relative; cursor: pointer; }
.opt-cards input { position: absolute; opacity: 0; pointer-events: none; }
.opt-cards span { display: flex; flex-direction: column; gap: 3px; height: 100%; padding: 11px 13px; border: 1px solid var(--input-line); border-radius: 12px; background: var(--input); }
.opt-cards small { color: var(--muted); font-size: 12px; line-height: 1.35; }
.opt-cards input:checked + span { border-color: var(--turq); background: var(--turq-soft); box-shadow: 0 0 0 1px var(--turq) inset; }
.opt-cards input:focus-visible + span { outline: 2px solid var(--orange); outline-offset: 2px; }
.clave-auto { display: flex; align-items: center; min-height: 42px; padding: 0 12px; border: 1px dashed var(--input-line); border-radius: 10px; background: var(--soft); font-weight: 800; color: var(--text); }

/* ===================== v1.10 ===================== */
/* "¿Cómo se lleva su inventario?" */
.modo-inv { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.field .modo-opt { position: relative; display: block; margin: 0; font-size: 13px; font-weight: 500; color: var(--text); cursor: pointer; }
.modo-opt input { position: absolute; opacity: 0; pointer-events: none; }
.modo-card { position: relative; display: flex; align-items: flex-start; gap: 12px; height: 100%; padding: 14px 44px 14px 14px; border: 1.5px solid var(--input-line); border-radius: 16px; background: var(--card); transition: border-color .15s, box-shadow .15s, transform .15s, background .15s; }
.modo-opt:hover .modo-card { border-color: var(--orange); box-shadow: 0 6px 18px rgba(126, 34, 206, .12); transform: translateY(-1px); }
.modo-ico { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; }
.modo-ico svg { width: 21px; height: 21px; }
.modo-ico.uni { background: var(--orange-soft); color: var(--orange); }
.modo-ico.env { background: var(--turq-soft); color: var(--turq-strong); }
.modo-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.modo-txt b { font-size: 14px; font-weight: 800; color: var(--text); }
.modo-txt small { font-size: 12.5px; font-weight: 500; line-height: 1.4; color: var(--muted); }
.modo-txt em { margin-top: 4px; align-self: flex-start; font-style: normal; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.modo-check { position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--input-line); display: grid; place-items: center; color: transparent; background: var(--card); }
.modo-check svg { width: 13px; height: 13px; stroke-width: 3; }
.modo-opt input:checked + .modo-card { border-color: var(--turq); background: linear-gradient(135deg, var(--turq-soft), transparent 70%); box-shadow: 0 0 0 3px rgba(27, 199, 199, .14); }
.modo-opt input:checked + .modo-card .modo-check { background: var(--turq); border-color: var(--turq); color: #fff; }
.modo-opt input:checked + .modo-card em { background: var(--card); color: var(--turq-strong); }
.modo-opt input:focus-visible + .modo-card { outline: 2px solid var(--orange); outline-offset: 2px; }

/* Menús desplegables: primera letra en mayúscula */
.cs-val::first-letter, .cs-opt > span::first-letter { text-transform: uppercase; }
.cs-opt > span { display: block; }

/* ===================== v1.11 ===================== */
.notif-ajustes { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--soft); font-size: 12.5px; }
.notif-ajustes summary { cursor: pointer; font-weight: 800; display: flex; align-items: center; gap: 8px; list-style: none; }
.notif-ajustes summary::-webkit-details-marker { display: none; }
.notif-ajustes summary svg { width: 16px; height: 16px; color: var(--orange); }
.notif-ajustes p { margin: 8px 0 0; line-height: 1.5; color: var(--muted); }
.notif-ajustes p b { color: var(--text); }

/* ===================== v1.12 ===================== */
/* Acciones clave del médico con color propio: Confirmar (verde) y No asistió (rojo) */
.icon-btn.fill-ok { background: #1BB56F; border-color: #1BB56F; color: #fff; box-shadow: 0 4px 12px rgba(27, 181, 111, .3); }
.icon-btn.fill-ok:hover { background: #15985C; border-color: #15985C; color: #fff; }
.icon-btn.fill-red { background: #E0464E; border-color: #E0464E; color: #fff; box-shadow: 0 4px 12px rgba(224, 70, 78, .3); }
.icon-btn.fill-red:hover { background: #C53039; border-color: #C53039; color: #fff; }
.btn.btn-confirmar { background: #1BB56F; border-color: #1BB56F; color: #fff; }
.btn.btn-confirmar:hover { background: #15985C; border-color: #15985C; color: #fff; }
.btn.btn-noasistio { background: #E0464E; border-color: #E0464E; color: #fff; }
.btn.btn-noasistio:hover { background: #C53039; border-color: #C53039; color: #fff; }

/* v1.14: hora libre del médico al agendar */
.hora-libre { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.hora-libre input[type="time"] { max-width: 170px; font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }

/* v1.16 · App instalada en pantalla completa
   - Android: display fullscreen; el encabezado incluye la zona segura superior (muesca).
   - Computadora: pantalla completa con la API Fullscreen (ver app.js). */
:root { --header-h: calc(72px + env(safe-area-inset-top, 0px)); }
@media (max-width: 720px) { :root { --header-h: calc(64px + env(safe-area-inset-top, 0px)); } }
.top { padding-top: env(safe-area-inset-top, 0px); }
@media (max-width: 760px) { .update-bar { top: calc(var(--header-h, 64px) + 8px); } }
.fs-btn { padding: 0; width: 40px; }

/* =====================================================================
   v7.0 · Metrología: equipos por tipo, verificación y estado por área
   ===================================================================== */
.notice.error { border-color: var(--bad-line); background: var(--bad-bg); color: var(--bad); align-items: center; }
.notice.error .btn { margin-left: auto; }
button.kpi { text-align: left; font: inherit; color: inherit; cursor: pointer; }
.page-actions.center { justify-content: center; }

/* Íconos por tipo de equipo */
.eq-ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: 0 0 auto; background: var(--orange-soft); color: var(--orange); }
.eq-ico.sm { width: 32px; height: 32px; border-radius: 9px; }
.eq-ico svg { width: 19px; height: 19px; }
.t-termometro { background: rgba(224, 70, 78, .12); color: #E0464E; }
.t-potenciometro { background: rgba(122, 91, 230, .13); color: #7A5BE6; }
.t-micropipeta { background: var(--turq-soft); color: var(--turq-strong); }
.t-termohigrometro { background: rgba(91, 141, 239, .14); color: #5B8DEF; }
.eq-cell { display: flex; align-items: center; gap: 11px; min-width: 0; }
.eq-cell > div { min-width: 0; }

/* Franja de tipos (filtro rápido) */
.type-strip { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: thin; }
.type-chip { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 14px 10px 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); box-shadow: var(--shadow); white-space: nowrap; font: inherit; cursor: pointer; transition: border-color .15s, transform .15s; }
.type-chip:hover { transform: translateY(-1px); border-color: var(--orange); }
.type-chip.on { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }
.type-chip .tc-ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--soft); }
.type-chip b { font-size: 20px; letter-spacing: -.02em; }
.type-chip > span:last-of-type { color: var(--muted); font-size: 12.5px; font-weight: 700; }
.type-chip em { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: #E0464E; color: #fff; font: 800 11px/20px var(--font); text-align: center; }

/* Registrar verificación */
.verif-layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, 1fr); gap: 18px; align-items: start; }
.verif-preview { position: sticky; top: calc(var(--header-h) + 16px); border-top: 4px solid var(--turq); }
.prev-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
.prev-head h3 { margin: 2px 0 0; font-size: 17px; }
.prev-head .pill { font-size: 13px; padding: 6px 12px; }
.prev-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.prev-item { background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.prev-item small { color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; }
.prev-item b { font-size: 16px; overflow-wrap: anywhere; }
.prev-item span { color: var(--muted); font-size: 12px; }
.lect-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.lect-grid .avg output { display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: var(--radius-sm); background: var(--turq-soft); color: var(--text); font-weight: 800; }
.eq-mini { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 12px; background: var(--soft); border: 1px solid var(--line); margin: 4px 0 14px; }
.eq-mini > div { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; color: var(--muted); }
.eq-mini b { color: var(--text); font-size: 14px; }
.form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
.result-card { text-align: center; padding: 40px 24px; grid-column: 1 / -1; border-top: 5px solid var(--ok); }
.result-card.bad { border-top-color: var(--bad); }
.result-card .result-ico { width: 74px; height: 74px; margin: 0 auto 12px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-bg); color: var(--ok); }
.result-card.bad .result-ico { background: var(--bad-bg); color: var(--bad); }
.result-card .result-ico svg { width: 38px; height: 38px; }
.result-card h2 { margin: 0 0 6px; }
.result-card p { color: var(--muted); margin: 0 0 18px; }

/* Ficha y tablas compactas */
.ficha-status { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.table.compact td, .table.compact th { padding: 8px 10px; font-size: 12.5px; }
.tipo-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }

/* Estado por departamento */
.dept-status { display: flex; flex-direction: column; gap: 6px; }
.dept-row { display: grid; grid-template-columns: minmax(160px, 1.1fr) 1fr 1fr; gap: 18px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.dept-row:last-child { border-bottom: 0; }
.dept-name { display: flex; flex-direction: column; gap: 3px; }
.dept-name span { color: var(--muted); font-size: 12.5px; }
.dept-metric { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.dept-metric > span { grid-column: 1 / -1; color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; }
.dept-metric small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.meter { height: 8px; border-radius: 6px; background: var(--soft); overflow: hidden; }
.meter span { display: block; height: 100%; border-radius: 6px; background: var(--ok); }
.meter span.warn { background: #FFB020; } .meter span.bad { background: #E0464E; }

@media (max-width: 980px) {
  .verif-layout { grid-template-columns: minmax(0, 1fr); }
  .verif-preview { position: static; }
  .dept-row { grid-template-columns: minmax(0, 1fr); gap: 8px; }
}
@media (max-width: 560px) {
  .lect-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .lect-grid .avg { grid-column: 1 / -1; }
  .prev-grid { grid-template-columns: minmax(0, 1fr); }
}

/* v7.0 · celdas de dos líneas y acciones en una fila */
.table td .cell-main, .table td .cell-sub { display: block; }
.table td .cell-sub + .cell-sub { margin-top: 1px; }
.table td .pill + .cell-sub { margin-top: 4px; }
.table td .eq-cell { justify-content: flex-start; text-align: left; }
.table td.actions .row-actions { flex-wrap: nowrap; }
@media (max-width: 760px) {
  .table-wrap.responsive td .eq-cell { justify-content: flex-end; text-align: right; }
}

body[data-route="verificar"] .fab-cita { display: none; }

/* =====================================================================
   v7.1 · Botones con color, KPI, ficha técnica, seguimiento y tablas
   ===================================================================== */
/* Botones de acción con color (el naranja principal se conserva) */
.btn.orange, .btn.grad-orange { background: linear-gradient(135deg, #7E22CE, #9333EA); color: #fff; box-shadow: 0 7px 16px rgba(126, 34, 206, .25); border: 0; }
.btn.teal, .btn.grad-teal { background: linear-gradient(135deg, #0FA3A6, #1BC7C7); color: #fff; box-shadow: 0 7px 16px rgba(15, 163, 166, .25); border: 0; }
.btn.green { background: linear-gradient(135deg, #15985C, #1BB56F); color: #fff; box-shadow: 0 7px 16px rgba(27, 181, 111, .25); border: 0; }
.btn.red { background: linear-gradient(135deg, #C42F37, #E0464E); color: #fff; box-shadow: 0 7px 16px rgba(224, 70, 78, .25); border: 0; }
.btn.violet { background: linear-gradient(135deg, #6D28D9, #8B5CF6); color: #fff; box-shadow: 0 7px 16px rgba(124, 58, 237, .25); border: 0; }
.btn.orange:hover, .btn.teal:hover, .btn.green:hover, .btn.red:hover, .btn.violet:hover { filter: brightness(1.06); transform: translateY(-1px); }
.btn.grad-orange, .btn.grad-teal { min-height: 44px; padding: 0 20px; border-radius: 999px; font-size: 13.5px; }
.card-head.center .btn { margin-top: 10px; }

/* KPI: íconos verde y rojo */
.kpi.i-green .kpi-ico { background: linear-gradient(135deg, #15985C, #4ADE80) !important; color: #fff !important; }
.kpi.i-red .kpi-ico { background: linear-gradient(135deg, #C42F37, #F87171) !important; color: #fff !important; }

/* Unidades: no se convierten a mayúsculas en los títulos (g, Kg, µL) */
.section-label .u { text-transform: none; letter-spacing: 0; }
.hint.center { text-align: center; }

/* Tablas: todo centrado; las celdas con ícono o foto se alinean dentro de un bloque fijo */
.table th, .table td { text-align: center !important; }
.table td .eq-cell { display: inline-flex; justify-content: flex-start; text-align: left; width: 250px; max-width: 100%; vertical-align: middle; }
.user-cell, .table td.col-user .user-cell { display: inline-flex !important; justify-content: flex-start !important; width: 330px; max-width: 100%; text-align: left; }
.user-txt { display: flex; flex-direction: column; min-width: 0; }
.user-txt b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-txt span { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 760px) {
  .table-wrap.responsive td .eq-cell, .table-wrap.responsive .user-cell { width: auto; justify-content: flex-end !important; }
  .table-wrap.responsive td, .table-wrap.responsive th { text-align: right !important; }
}

/* Selector de tipo de equipo (Nuevo equipo) */
.tipo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.tipo-opt { position: relative; display: block; cursor: pointer; }
.tipo-opt input { position: absolute; opacity: 0; pointer-events: none; }
.tipo-card { position: relative; display: flex; align-items: center; gap: 12px; padding: 14px 40px 14px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); min-height: 74px; transition: border-color .15s, box-shadow .15s, transform .15s; }
.tipo-opt:hover .tipo-card { border-color: var(--turq); transform: translateY(-1px); }
.tipo-opt input:checked + .tipo-card { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); background: linear-gradient(135deg, var(--orange-soft), transparent 70%); }
.tipo-opt input:focus-visible + .tipo-card { outline: 2px solid var(--turq); outline-offset: 2px; }
.tipo-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tipo-txt b { font-size: 14.5px; color: var(--text); }
.tipo-txt span { font-size: 12px; color: var(--muted); }
.tipo-check { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--orange); color: #fff; opacity: 0; transition: opacity .15s; }
.tipo-check svg { width: 15px; height: 15px; }
.tipo-opt input:checked + .tipo-card .tipo-check { opacity: 1; }
.eq-ico.lg { width: 46px; height: 46px; border-radius: 13px; }

/* Ficha técnica del equipo */
.ficha-hero { display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 16px; background: linear-gradient(135deg, var(--soft), transparent); border: 1px solid var(--line); }

.fh-txt > span { color: var(--muted); font-size: 13px; }
.fh-txt .ficha-status { margin: 6px 0 0; }
.fh-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.ficha-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 14px 0; }
.ficha-stat { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); border-left: 4px solid var(--gray); }
.ficha-stat > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ficha-stat small { color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
.ficha-stat b { font-size: 17px; }
.ficha-stat span:last-child { color: var(--muted); font-size: 12px; }
.fs-ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--gray-bg); color: var(--gray); flex: 0 0 auto; }
.ficha-stat.ok { border-left-color: var(--ok); } .ficha-stat.ok .fs-ico { background: var(--ok-bg); color: var(--ok); }
.ficha-stat.bad { border-left-color: var(--bad); } .ficha-stat.bad .fs-ico { background: var(--bad-bg); color: var(--bad); }
.ficha-stat.warn { border-left-color: #FFB020; } .ficha-stat.warn .fs-ico { background: var(--warn-bg); color: var(--warn); }
.ficha-stat.info { border-left-color: var(--turq); } .ficha-stat.info .fs-ico { background: var(--info-bg); color: var(--info); }
.ficha-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ficha-card { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; background: var(--card); }
.ficha-card > h4 { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 14px; }
.ficha-card > h4 svg { width: 17px; height: 17px; color: var(--orange); }
.info-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0; }
.info-tiles > div { background: var(--soft); border-radius: 10px; padding: 9px 11px; min-width: 0; }
.info-tiles > div.wide { grid-column: 1 / -1; }
.info-tiles dt { color: var(--muted); font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 3px; }
.info-tiles dd { margin: 0; font-weight: 700; font-size: 13.5px; overflow-wrap: anywhere; }
.result-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 12px; border-radius: 14px; margin-bottom: 12px; background: var(--ok-bg); border: 1px solid var(--ok-line); }
.result-strip.bad { background: var(--bad-bg); border-color: var(--bad-line); }
.result-strip > div { display: flex; flex-direction: column; gap: 2px; text-align: center; }
.result-strip small { color: var(--muted); font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
.result-strip b { font-size: 16px; }
.result-strip span { color: var(--muted); font-size: 11.5px; }

/* Seguimiento de verificaciones que no cumplen */
.seg-box { margin-top: 14px; padding: 14px 16px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); }
.seg-box.bad { border-color: var(--bad-line); background: linear-gradient(135deg, var(--bad-bg), transparent 60%); }
.seg-box.warn { border-color: var(--warn-line); background: linear-gradient(135deg, var(--warn-bg), transparent 60%); }
.seg-box.ok { border-color: var(--ok-line); background: linear-gradient(135deg, var(--ok-bg), transparent 60%); }
.seg-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.seg-head h4 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 15px; }
.seg-head p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }

@media (max-width: 760px) {
  .ficha-hero { flex-wrap: wrap; }
  .fh-actions { width: 100%; justify-content: flex-start; }
  .ficha-stats, .ficha-cols { grid-template-columns: minmax(0, 1fr); }
  .result-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* =====================================================================
   v7.2 · KPI, tipos, formularios, usuarios, perfil y bitácora
   ===================================================================== */

.kpi.i-red::before { background: linear-gradient(180deg, #C42F37, #F87171) !important; }

/* Tarjetas de tipo de equipo (filtro rápido) */

.type-chip .tc-txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }

/* Formularios por secciones */

.form-grid > .form-section:first-child, .form-grid > .form-section:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.form-section .fs-ico { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--orange-soft); color: var(--orange); flex: 0 0 auto; }
.form-section .fs-ico svg { width: 17px; height: 17px; }
.form-section b { display: block; font-size: 14px; }
.form-section small { display: block; color: var(--muted); font-size: 12px; font-weight: 500; }
.form-banner { display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin-bottom: 14px; border-radius: 16px; background: linear-gradient(135deg, var(--orange-soft), var(--turq-soft)); border: 1px solid var(--line); }
.form-banner > div { display: flex; flex-direction: column; gap: 2px; }
.form-banner b { font-size: 16px; }
.form-banner span:not(.eq-ico) { color: var(--muted); font-size: 12.5px; }
.input-suffix { position: relative; }
.input-suffix input { padding-right: 58px; }
.input-suffix .sfx { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); padding: 3px 8px; border-radius: 8px; background: var(--soft); border: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 800; pointer-events: none; }
.pro-form .field .hint { display: block; margin-top: 4px; font-size: 11.5px; }
.switch-row { cursor: pointer; }
.switch-row > span { display: flex; flex-direction: column; gap: 2px; text-align: left; }
.switch-row > span small { color: var(--muted); font-size: 12px; font-weight: 500; }
.switch-row input { flex: 0 0 auto; }

/* Usuarios */
.user-form-top { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 22px; align-items: start; margin-top: 12px; }
.user-form-top .photo-pick { flex-direction: column; text-align: center; gap: 12px; padding: 16px 12px; border-radius: 16px; background: var(--soft); border: 1px solid var(--line); position: sticky; top: 0; }
.user-form-top .photo-pick .avatar.xl { width: 140px; height: 140px; font-size: 44px; }
.user-form-top .photo-pick .btns { flex-direction: column; width: 100%; }
.user-form-top .photo-pick .btns .btn { width: 100%; }
.acc-box .search { width: 100%; margin-top: 8px; }
.acc-box .acc-results:empty { display: none; }
.acc-results .acc-main { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.acc-results .acc-main small { color: var(--muted); }
.rol-pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.rol-opt { position: relative; cursor: pointer; }
.rol-opt input { position: absolute; opacity: 0; pointer-events: none; }
.rol-opt > span { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: center; padding: 12px; border-radius: 13px; border: 1.5px solid var(--line); background: var(--card); height: 100%; }
.rol-opt > span svg { grid-row: span 2; width: 22px; height: 22px; color: var(--muted); }
.rol-opt > span small { color: var(--muted); font-size: 11.5px; }
.rol-opt input:checked + span { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }
.rol-opt input:checked + span svg { color: var(--orange); }

.user-cell.sm { width: 210px; }
.user-cell.sm .avatar { width: 32px; height: 32px; font-size: 11px; }

/* Mi perfil: botón para cambiar la foto sobre el retrato */
.profile-hero .access-photo .photo-edit { position: absolute; left: 8px; bottom: 8px; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #0FA3A6, #1BC7C7); color: #fff; box-shadow: 0 8px 18px rgba(0, 0, 0, .25); cursor: pointer; border: 3px solid var(--card); transition: transform .15s; }
.profile-hero .access-photo .photo-edit:hover { transform: scale(1.08); }
.profile-hero .access-photo .photo-edit svg { width: 19px; height: 19px; }

/* Bitácora */
.mod-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); font-size: 12px; font-weight: 700; white-space: nowrap; }
.mod-chip svg { width: 14px; height: 14px; color: var(--orange); }
.bit-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 16px; align-items: center; padding: 16px; border-radius: 16px; background: linear-gradient(135deg, var(--soft), transparent); border: 1px solid var(--line); margin-bottom: 16px; }
.bit-who .user-cell { width: auto; }
.bit-who .user-txt b { font-size: 16px; }
.bit-meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.bit-meta > div { background: var(--card); border: 1px solid var(--line); border-radius: 11px; padding: 9px 11px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.bit-meta > div.wide { grid-column: 1 / -1; }
.bit-meta small { color: var(--muted); font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
.bit-meta b { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.bit-meta b svg, .bit-meta .pill svg { width: 14px; height: 14px; }
.bit-meta .pill { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; }
.bit-sec { display: flex; align-items: center; gap: 8px; margin: 6px 0 10px; font-size: 14px; }
.bit-sec svg { width: 17px; height: 17px; color: var(--orange); }
.bit-sec .count { background: var(--orange-soft); color: var(--orange); border-radius: 999px; padding: 1px 9px; font-size: 12px; }
.table.bit-diff th[scope="row"] { font-weight: 700; color: var(--text); background: transparent; text-transform: none; letter-spacing: 0; font-size: 13px; white-space: normal; }
.table.bit-diff td.old { color: var(--bad); text-decoration: line-through; text-decoration-color: rgba(224, 70, 78, .45); }
.table.bit-diff td.new { color: var(--text); font-weight: 600; }

.bit-more { margin-top: 14px; }
.bit-more summary { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--turq-strong); }
.bit-more summary svg { width: 15px; height: 15px; }

@media (max-width: 760px) {
  .user-form-top { grid-template-columns: minmax(0, 1fr); }
  .user-form-top .photo-pick { position: static; }

}

/* =====================================================================
   v7.3 · Verificación por buffers (potenciómetro) y corrección (termómetro)
   ===================================================================== */
.pt-table { display: flex; flex-direction: column; gap: 6px; }
.pt-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) 110px 110px; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--soft); border: 1px solid var(--line); }
.pt-row.pt-head { background: transparent; border: 0; padding: 0 10px; color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }

.pt-row input { width: 100%; text-align: center; }
.pt-ref input { font-weight: 800; background: var(--card); }

.ajuste-box { margin-top: 10px; padding: 14px; border-radius: 14px; border: 1.5px dashed var(--orange); background: linear-gradient(135deg, var(--orange-soft), transparent 70%); }

.dev-strip { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; padding: 10px 14px; border-radius: 12px; background: var(--soft); border: 1px solid var(--line); }

.dev-strip b { font-size: 18px; }
.dev-strip.ok { background: var(--ok-bg); border-color: var(--ok-line); } .dev-strip.ok b { color: var(--ok); }
.dev-strip.warn { background: var(--warn-bg); border-color: var(--warn-line); } .dev-strip.warn b { color: var(--warn); }
.dev-strip.bad { background: var(--bad-bg); border-color: var(--bad-line); } .dev-strip.bad b { color: var(--bad); }
.rep-box { margin-top: 8px; }
.rep-box summary { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--turq-strong); }

.rep-box .form-grid { margin-top: 8px; }
@media (max-width: 560px) {

}

/* =====================================================================
   v7.5 · Tarjetas de filtro por tipo de equipo
   ===================================================================== */
.type-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; overflow: visible; padding: 2px 0 16px; }
.type-card { position: relative; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px;
  border: 1px solid var(--line); background: var(--card); color: var(--text); text-align: left; font: inherit; cursor: pointer;
  box-shadow: 0 1px 2px rgba(15, 35, 50, .04); transition: border-color .15s, box-shadow .15s, transform .15s; }
.type-card:hover { border-color: var(--input-line); box-shadow: var(--shadow); transform: translateY(-1px); }
.type-card:focus-visible { outline: 2px solid var(--turq); outline-offset: 2px; }

.type-card.on::before { background: var(--orange); }
.tk-ico { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; flex: 0 0 auto; background: var(--orange-soft); color: var(--orange); }
.tk-ico:not([class*="t-"]) { background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: #fff; }
.tk-ico svg { width: 22px; height: 22px; }
.tk-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.tk-name { font-size: 14px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tk-meta { color: var(--muted); font-size: 12.5px; }
.tk-meta b { color: var(--text); font-size: 15px; font-weight: 900; }
.tk-state { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; }

.tk-state.bad { color: var(--bad); }
.tk-state.ok { color: var(--ok); }
.tk-check { position: absolute; top: 10px; right: 10px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
  background: var(--orange); color: #fff; opacity: 0; transform: scale(.6); transition: opacity .15s, transform .15s; }
.tk-check svg { width: 12px; height: 12px; }
.type-card.on .tk-check { opacity: 1; transform: scale(1); }
@media (max-width: 560px) {
  .type-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .type-card { padding: 10px 12px; gap: 10px; }

   v7.6 · Menos naranja: navy para guardar/administrar, contorno para
   configuración; el naranja queda solo en la acción principal de cada página.
   ===================================================================== */
.btn.navy { background: linear-gradient(135deg, #0B1E2D, #1D4260); color: #fff; box-shadow: 0 7px 16px rgba(11, 30, 45, .22); border: 0; }
.btn.navy:hover { filter: brightness(1.15); transform: translateY(-1px); }

.btn.outline { background: var(--card); color: var(--text); border: 1.5px dashed var(--input-line); box-shadow: none; }
.btn.outline svg { color: var(--turq-strong); }
.btn.outline:hover { border-style: solid; border-color: var(--turq); color: var(--turq-strong); background: var(--turq-soft); }
/* Tarjetas de tipo: selección en turquesa (no naranja) */
.type-card.on { border-color: var(--turq); box-shadow: 0 0 0 3px var(--turq-soft), var(--shadow); }
.type-card.on::before, .tk-check { background: var(--turq-strong); }
/* Avisos push */
.avisos-estado { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface, var(--card)); font-size: 13px; }

.avisos-estado .btns, .avisos-sugerencia .btns { display: flex; gap: 8px; flex-wrap: wrap; }

.card-head h3 svg { width: 17px; height: 17px; vertical-align: -3px; color: var(--turq-strong); }
.txt-bad { color: var(--bad); }

/* =====================================================================
   v7.7 · Etiquetas, activar/inactivar y etiqueta dañada
   ===================================================================== */
.etq-opciones { display: grid; gap: 12px; }
.etq-tipos { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }

/* =====================================================================

  padding: 30px 32px; border-radius: 22px; color: #fff; margin-bottom: 18px;

.faq-hero .eyebrow { color: #D8B4FE; }
.faq-hero h1 { margin: 6px 0 6px; font-size: clamp(26px, 3.4vw, 36px); letter-spacing: -.03em; line-height: 1.08; }

.faq-search { display: flex; align-items: center; gap: 10px; max-width: 560px; padding: 0 16px; height: 50px; border-radius: 14px; background: #fff; color: #172431; box-shadow: 0 10px 26px rgba(0, 0, 0, .22); }
.faq-search svg { width: 19px; height: 19px; color: #0FA3A6; flex: 0 0 auto; }
.faq-search input { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; font-size: 14.5px; color: #172431; min-width: 0; }
.faq-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 14px; font-size: 12.5px; color: #A9BDCD; }

.faq-meta svg { width: 14px; height: 14px; }
.faq-guia { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 8px; padding: 20px; border-radius: 18px; background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .14); }
.faq-guia-ico { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; background: linear-gradient(135deg, #7E22CE, #9333EA); }
.faq-guia-ico svg { width: 23px; height: 23px; color: #fff; }

.faq-guia span { color: #C8D6E2; font-size: 12.8px; line-height: 1.45; }

.faq-chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: thin; }
.faq-chip { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); font-size: 13px; font-weight: 700; text-decoration: none; transition: border-color .15s, background .15s; }
.faq-chip svg { width: 15px; height: 15px; color: var(--turq-strong); }
.faq-chip:hover { border-color: var(--turq); background: var(--turq-soft); }
.faq-body { display: grid; gap: 18px; }
.faq-sec { scroll-margin-top: 90px; padding: 22px 24px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
.faq-sec h2 { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; font-size: 19px; letter-spacing: -.02em; }
.faq-sec h2 small { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--muted); }
.faq-sec-ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--orange-soft); color: var(--orange); flex: 0 0 auto; }
.faq-sec-ico svg { width: 19px; height: 19px; }
.faq-list { display: grid; gap: 8px; }
.faq-item { border: 1px solid var(--line); border-radius: 14px; background: var(--card); transition: border-color .15s, box-shadow .15s; }
.faq-item[open] { border-color: var(--turq); box-shadow: 0 0 0 3px var(--turq-soft); }
.faq-item summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; cursor: pointer; font-weight: 800; font-size: 14.5px; }

.faq-intro { margin: -4px 0 16px; color: var(--muted); font-size: 14px; }
.faq-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.faq-tab { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); text-align: left; font: inherit; cursor: pointer; }
.faq-tab svg { width: 22px; height: 22px; color: var(--muted); flex: 0 0 auto; }
.faq-tab span { display: flex; flex-direction: column; min-width: 0; }

.faq-tab.on svg { color: var(--turq-strong); }
.faq-pasos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }

@media (max-width: 1100px) { .faq-pasos { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 860px) { .faq-hero { grid-template-columns: 1fr; padding: 24px 20px; } }
@media (max-width: 560px) {
  .faq-sec { padding: 16px 14px; border-radius: 16px; }
  .faq-tabs { grid-template-columns: 1fr; }
  .faq-tab small { display: none; }
  .faq-pasos { grid-template-columns: 1fr; }
  .faq-paso { flex-direction: row; }
  .faq-ilus { width: 42%; flex: 0 0 auto; padding: 8px; }
  .faq-item summary { font-size: 14px; padding: 13px 14px; }
}

/* v7.9 · Día sin uso y buffer opcional */
.sin-uso { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 10px 0 4px; padding: 10px 12px; border-radius: 12px; border: 1px dashed var(--input-line); background: var(--card); font-size: 13px; }

/* =====================================================================
   v8.2.0 · Sistema visual de Ruta de calidad: superficies --hero-* claro y
   oscuro, indicadores .kx, dock móvil, ilustraciones propias, perfil y
   créditos, avisos, gráficas ampliables y movimiento (solo transform y
   opacity). Va al final para prevalecer.
   ===================================================================== */
:root {
  --hero-bg: radial-gradient(420px 260px at 0% 0%, rgba(126, 34, 206, .17), transparent 70%), radial-gradient(380px 240px at 100% 100%, rgba(251, 191, 36, .16), transparent 70%), linear-gradient(160deg, #FFF8F0, #FFFFFF 52%, #F4F7FA);
  --hero-line: rgba(126, 34, 206, .24);
  --hero-shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 22px 44px -26px rgba(194, 65, 12, .42);
  --hero-txt: #172431; --hero-sub: #5B6B79; --hero-acc: #6B21A8; --hero-score: #6B21A8;
  --hero-chip: rgba(255, 255, 255, .82); --hero-chip-line: rgba(15, 23, 42, .08); --hero-chip-txt: #334155;
  --hero-track: rgba(15, 23, 42, .08); --hero-ring: #FFFFFF; --hero-deco: rgba(126, 34, 206, .14);
  --rol-txt: #581C87; --rol-bg: linear-gradient(135deg, rgba(126, 34, 206, .14), rgba(234, 179, 8, .12)); --rol-line: rgba(126, 34, 206, .35);
  --acc-txt: #6B21A8; --acc-txt-2: #B45309; --turq-txt: #0E7490;
  --sombra-card: 0 1px 2px rgba(15, 23, 42, .04), 0 10px 28px -16px rgba(15, 23, 42, .18);
  --sombra-card-hover: 0 2px 4px rgba(15, 23, 42, .05), 0 18px 36px -16px rgba(15, 23, 42, .26);
}
:root[data-theme="dark"] {
  --hero-bg: radial-gradient(420px 240px at 0% 0%, rgba(126, 34, 206, .30), transparent 70%), radial-gradient(360px 220px at 100% 100%, rgba(251, 191, 36, .12), transparent 70%), linear-gradient(155deg, #12293B, #0A1B28 72%);
  --hero-line: rgba(255, 255, 255, .07);
  --hero-shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 22px 44px -24px rgba(0, 0, 0, .75);
  --hero-txt: #FFFFFF; --hero-sub: rgba(214, 226, 235, .76); --hero-acc: #D8B4FE; --hero-score: #FFC46B;
  --hero-chip: rgba(255, 255, 255, .07); --hero-chip-line: rgba(255, 255, 255, .1); --hero-chip-txt: #DCE6EE;
  --hero-track: rgba(255, 255, 255, .1); --hero-ring: #0D2131; --hero-deco: rgba(255, 255, 255, .06);
  --rol-txt: #FFD9A8; --rol-bg: linear-gradient(135deg, rgba(126, 34, 206, .26), rgba(234, 179, 8, .14)); --rol-line: rgba(255, 190, 110, .45);
  --acc-txt: #D8B4FE; --acc-txt-2: #FCD34D; --turq-txt: #5EE6E6;
  --sombra-card: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 30px -18px rgba(0, 0, 0, .6);
  --sombra-card-hover: 0 2px 4px rgba(0, 0, 0, .35), 0 20px 38px -16px rgba(0, 0, 0, .75);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --hero-bg: radial-gradient(420px 240px at 0% 0%, rgba(126, 34, 206, .30), transparent 70%), radial-gradient(360px 220px at 100% 100%, rgba(251, 191, 36, .12), transparent 70%), linear-gradient(155deg, #12293B, #0A1B28 72%);
    --hero-line: rgba(255, 255, 255, .07);
    --hero-shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 22px 44px -24px rgba(0, 0, 0, .75);
    --hero-txt: #FFFFFF; --hero-sub: rgba(214, 226, 235, .76); --hero-acc: #D8B4FE; --hero-score: #FFC46B;
    --hero-chip: rgba(255, 255, 255, .07); --hero-chip-line: rgba(255, 255, 255, .1); --hero-chip-txt: #DCE6EE;
    --hero-track: rgba(255, 255, 255, .1); --hero-ring: #0D2131; --hero-deco: rgba(255, 255, 255, .06);
    --rol-txt: #FFD9A8; --rol-bg: linear-gradient(135deg, rgba(126, 34, 206, .26), rgba(234, 179, 8, .14)); --rol-line: rgba(255, 190, 110, .45);
    --acc-txt: #D8B4FE; --acc-txt-2: #FCD34D; --turq-txt: #5EE6E6;
    --sombra-card: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 30px -18px rgba(0, 0, 0, .6);
    --sombra-card-hover: 0 2px 4px rgba(0, 0, 0, .35), 0 20px 38px -16px rgba(0, 0, 0, .75);
  }
}

/* ---------- Ilustraciones ---------- */
.emoji { display: inline-block; width: 24px; height: 24px; flex: 0 0 auto; vertical-align: middle; filter: none; }
.emoji.xs { width: 15px; height: 15px; }
.emoji.sm { width: 18px; height: 18px; }
.pill.con-ilus { gap: 4px; padding-left: 5px; }
.pill.con-ilus .emoji.xs { width: 15px; height: 15px; margin: -2px 0; filter: drop-shadow(0 0 1px rgba(255, 255, 255, .7)); }
.eq-ico.ilus, .tk-ico.ilus { padding: 4px; }
.eq-ico.ilus .emoji { width: 82%; height: 82%; transition: transform .25s cubic-bezier(.3, 1.4, .5, 1); }
.tk-ico.ilus .emoji { width: 80%; height: 80%; transition: transform .25s cubic-bezier(.3, 1.4, .5, 1); }
.eq-ico.t-termometro { background: rgba(224, 70, 78, .12); } .eq-ico.t-potenciometro { background: rgba(122, 91, 230, .13); }
.eq-ico.t-micropipeta { background: var(--turq-soft); } .eq-ico.t-bascula { background: var(--orange-soft); }
.list-item:hover .eq-ico.ilus .emoji, .type-card:hover .tk-ico .emoji, tr:hover .eq-ico.ilus .emoji { transform: scale(1.08) rotate(-3deg); }
.section-label.con-ilus { display: flex; align-items: center; gap: 8px; } .section-label.con-ilus .emoji { width: 26px; height: 26px; }

/* Menú lateral y dock con ilustración */
.nav a .nav-ilus { width: 24px; height: 24px; flex: 0 0 auto; display: block; transition: transform .25s cubic-bezier(.3, 1.4, .5, 1); }
.nav a:hover .nav-ilus { transform: scale(1.08); }
.nav a.active .nav-ilus { filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .28)); }

/* Estados vacíos y de error con ilustración */
.empty .empty-ico.ilus, .empty.error .empty-ico.ilus { width: 64px; height: 64px; background: none; border-radius: 0; }
.empty .empty-ico.ilus .emoji { width: 60px; height: 60px; }

/* ---------- Indicadores (.kx) ---------- */
.kx { --ac: #7E22CE; position: relative; isolation: isolate; display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; padding: 22px 20px 18px; border-radius: 18px;
  background: var(--card); border: 1px solid var(--line); overflow: hidden; box-shadow: var(--sombra-card);
  transition: transform .2s cubic-bezier(.2, .7, .2, 1), box-shadow .2s, border-color .2s; }
.kx::before { content: ""; position: absolute; z-index: -1; inset: 0; background: radial-gradient(180px 140px at 100% 0, color-mix(in srgb, var(--ac) 11%, transparent), transparent 72%); }
.kx::after { content: ""; position: absolute; left: 20px; right: 20px; top: 0; height: 2px; border-radius: 0 0 3px 3px; background: linear-gradient(90deg, var(--ac), color-mix(in srgb, var(--ac) 20%, transparent)); }
.kx.t-orange { --ac: #7E22CE; } .kx.t-green { --ac: #16A34A; } .kx.t-red { --ac: #DC2626; } .kx.t-blue { --ac: #2563EB; } .kx.t-violet { --ac: #7C3AED; }
.kx-top { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-width: 0; padding: 0 46px; }
.kx-top small { min-width: 0; font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); line-height: 1.3; }
.kx-ico { position: absolute; top: 14px; right: 14px; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--ac);
  background: color-mix(in srgb, var(--ac) 11%, var(--card)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ac) 20%, transparent); }
.kx-ico svg { width: 19px; height: 19px; stroke-width: 2.1; }
.kx-ico.ilus-box { width: 46px; height: 46px; border-radius: 0; background: none; box-shadow: none; }
.kx-ico .ilus { width: 46px; height: 46px; display: block; transition: transform .25s cubic-bezier(.3, 1.4, .5, 1); }
.kx:hover .kx-ico .ilus { transform: scale(1.08) rotate(-3deg); }
.kx strong { display: block; margin-top: 18px; font-size: 34px; font-weight: 800; line-height: 1; letter-spacing: -.035em; color: var(--text); font-variant-numeric: tabular-nums; }
.kx.texto strong { font-size: clamp(19px, 1.9vw, 24px); line-height: 1.2; letter-spacing: -.02em; overflow-wrap: break-word; text-wrap: balance; }
.kx-desc { margin-top: 8px; max-width: 30ch; font-size: 12.5px; line-height: 1.4; color: var(--muted); }
.kx-barra { display: block; width: min(220px, 100%); margin-top: 14px; height: 6px; border-radius: 99px; overflow: hidden; background: color-mix(in srgb, var(--ac) 13%, transparent); }
.kx-barra i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, color-mix(in srgb, var(--ac) 75%, #fff), var(--ac)); transform-origin: left; animation: kxBarra 1s .15s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes kxBarra { from { transform: scaleX(0); } }
.kx-go { display: inline-flex; align-self: center; align-items: center; gap: 5px; margin-top: auto; padding-top: 14px; font-size: 12px; font-weight: 700; color: var(--ac); }
.kx-go svg { width: 14px; height: 14px; transition: transform .2s; }
.kx.go { cursor: pointer; }
.kx.go:hover, .kx.go:focus-visible { transform: translateY(-3px); border-color: color-mix(in srgb, var(--ac) 35%, var(--line)); box-shadow: 0 2px 4px rgba(15, 23, 42, .05), 0 18px 36px -16px color-mix(in srgb, var(--ac) 45%, transparent); outline: none; }
.kx.go:focus-visible { box-shadow: 0 0 0 3px rgba(27, 199, 199, .55), 0 18px 36px -16px color-mix(in srgb, var(--ac) 45%, transparent); }
.kx.go:hover .kx-go svg, .kx.go:focus-visible .kx-go svg { transform: translateX(3px); }
.kx.go:active { transform: translateY(-1px) scale(.99); }
.kx.sel { border-color: color-mix(in srgb, var(--ac) 55%, var(--line)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ac) 40%, transparent), var(--sombra-card); }
.kx-grid { gap: 14px; }
.kx-grid > .kx { min-height: 168px; }
@media (max-width: 1180px) { .kx-grid.grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 720px) {
  .kx-grid, .kx-grid.grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .kx-grid > .kx { min-height: 0; }
  .kx { padding: 50px 12px 14px; border-radius: 16px; }
  .kx::after { left: 15px; right: 15px; }
  .kx-top { padding: 0; }
  .kx-top small { font-size: 10.5px; letter-spacing: .05em; }
  .kx-ico { top: 10px; right: 10px; }
