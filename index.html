        { label: 'Ubicación', render: (e) => `<b class="cell-main">${esc(e.departamento_calbas || '—')}</b><span class="cell-sub">${esc(e.ubicacion_calbas || '')}</span>` },
        { label: 'Rango', render: (e) => (e.rango_max_calbas != null ? `<span class="mono">${fmtVal(e.rango_min_calbas ?? 0)}–${fmtVal(e.rango_max_calbas)} ${esc(U(e.unidad_calbas))}</span>` : `<span class="mono">${esc(U(e.unidad_calbas))}</span>`) },
        { label: 'Verificación', render: (e) => `${verPill(e.estado_verificacion_calbas)}<span class="cell-sub">${e.requiere_verificacion_calbas === false ? 'Sin verificación interna' : e.ultima_verificacion_calbas ? `Última ${fmtDate(e.ultima_verificacion_calbas)} · ${e.ultimo_dictamen_calbas === 'NO_CUMPLE' ? 'No cumple' : 'Cumple'}` : (e.frecuencia_verificacion_dias_calbas === 1 ? "Diaria" : `Cada ${e.frecuencia_verificacion_dias_calbas} días`)}</span>${e.activo_calbas && e.requiere_verificacion_calbas !== false && e.proxima_verificacion_calbas ? `<span class="prox-ver st-${esc(e.estado_verificacion_calbas)}">${icon('calendar-clock')} Próxima ${fmtDate(e.proxima_verificacion_calbas)}</span>` : ''}` },
        { label: 'Calibración', render: (e) => `${calPill(e.estado_calibracion_calbas)}<span class="cell-sub">${e.vencimiento_calibracion_calbas ? `Vence ${fmtDate(e.vencimiento_calibracion_calbas)}` : 'Sin certificado'}</span>` },
        { label: '', cls: 'actions', render: (e) => `<div class="row-actions">
            <button class="icon-btn" data-ficha="${e.id_calbas}" title="Ficha del equipo" aria-label="Ficha del equipo">${icon('file-text')}</button>
            ${e.activo_calbas && e.requiere_verificacion_calbas === false ? '' : e.activo_calbas ? `<button class="icon-btn" data-verif="${e.id_calbas}" data-origen="${e.origen_calbas}" title="Registrar verificación" aria-label="Registrar verificación">${icon('clipboard-plus')}</button>` : pillIlus('Inactivo', 'gray', 'inactivo')}
            ${state.isAdmin ? `<button class="icon-btn" data-etq="${e.id_calbas}" title="Etiqueta (PDF)" aria-label="Etiqueta en PDF">${icon('tag')}</button>
            <button class="icon-btn" data-editar="${e.id_calbas}" title="Editar" aria-label="Editar">${icon('pencil')}</button>
            <button class="icon-btn ${e.activo_calbas ? 'danger-hover' : 'ok-hover'}" data-activo="${e.id_calbas}" title="${e.activo_calbas ? 'Inactivar' : 'Activar'}" aria-label="${e.activo_calbas ? 'Inactivar equipo' : 'Activar equipo'}">${icon(e.activo_calbas ? 'power-off' : 'power')}</button>` : ''}</div>` },
      ],
      empty: { ico: 'gauge', title: 'Sin equipos registrados', text: state.isAdmin ? 'Registra tu primer equipo con el botón “Nuevo equipo”.' : 'No hay equipos asignados a tus departamentos.' },
      fetch: async ({ from, to, filters: f }) => {
        let rows = todos;
        const q = sanitizeSearch(f.q).toLowerCase();
        if (q) rows = rows.filter((e) => [e.codigo_calbas, e.ubicacion_calbas, e.marca_calbas, e.modelo_calbas, e.numero_serie_calbas, e.descripcion_calbas, e.departamento_calbas]
          .some((x) => String(x || '').toLowerCase().includes(q)));
        if (f.tipo) rows = rows.filter((e) => e.tipo_clave_calbas === f.tipo);
        if (f.depto) rows = rows.filter((e) => e.departamento_id_calbas === f.depto);
        rows = rows.filter((e) => (f.estado === 'inactivos' ? !e.activo_calbas : e.activo_calbas));
        const filtros = {
          cal_vencida: (e) => e.estado_calibracion_calbas === 'vencida', cal_por_vencer: (e) => e.estado_calibracion_calbas === 'por_vencer',
          cal_sin: (e) => e.estado_calibracion_calbas === 'sin_registro', ver_atrasada: (e) => ['vencida', 'sin_registro'].includes(e.estado_verificacion_calbas),
          no_cumple: (e) => e.ultimo_dictamen_calbas === 'NO_CUMPLE',
        };
        if (filtros[f.estado]) rows = rows.filter(filtros[f.estado]);
        return { rows: rows.slice(from, to + 1), count: rows.length };
      },
    });
    const apply = () => table.setFilters({
      q: el.querySelector('#eq-q').value, tipo: el.querySelector('#eq-tipo').value,
      depto: el.querySelector('#eq-depto').value, estado: el.querySelector('#eq-estado').value,
    });
    el.querySelector('#eq-q').addEventListener('input', debounce(apply, 250));
    ['#eq-tipo', '#eq-depto', '#eq-estado'].forEach((s) => el.querySelector(s).addEventListener('change', apply));
    el.addEventListener('click', onClick);
    await recargar(apply);
    if (params.ficha) abrirFicha(params.ficha);
  },
  destroy() { root = null; table = null; },
};

async function recargar(apply) {
  todos = await cargarEquipos();
  if (!root) return;
  pintarTipos();
  await (apply ? apply() : table.load());
}

function pintarTipos() {
  const strip = root.querySelector('#eq-tipos');
  const activos = todos.filter((e) => e.activo_calbas);
  const grupos = {};
  activos.forEach((e) => { (grupos[e.tipo_clave_calbas] ||= { n: 0, alerta: 0, nombre: e.tipo_nombre_calbas, ico: ilusTipo({ tipo_clave_calbas: e.tipo_clave_calbas, nombre_calbas: e.tipo_clave_calbas === 'BASCULA' ? '' : e.tipo_nombre_calbas }) }).n++; });
  activos.forEach((e) => { if (e.estado_calibracion_calbas === 'vencida' || e.ultimo_dictamen_calbas === 'NO_CUMPLE') grupos[e.tipo_clave_calbas].alerta++; });
  const sel = root.querySelector('#eq-tipo').value;
  const alertasTot = Object.values(grupos).reduce((s, g) => s + g.alerta, 0);
  // Tarjeta de filtro por tipo: ícono, nombre, total y estado (alertas o al día)
  const chip = (k, ico, cls, n, nombre, alerta) => `<button class="type-card ${sel === k ? 'on' : ''}" data-tipo="${esc(k)}" aria-pressed="${sel === k}">
      <span class="tk-ico ilus ${cls}">${emoji(ico)}</span>
      <span class="tk-body"><span class="tk-name">${esc(nombre)}</span>
        <span class="tk-meta"><b>${n}</b> ${n === 1 ? 'equipo' : 'equipos'}</span>
        ${alerta ? `<span class="tk-state bad" title="Calibración vencida o último dictamen no cumple">${icon('triangle-alert')} ${alerta} con alerta</span>` : `<span class="tk-state ok">${icon('circle-check')} Al día</span>`}</span>
      <span class="tk-check">${icon('check')}</span></button>`;
  strip.innerHTML = chip('', 'n_equipos', '', activos.length, 'Todos los equipos', alertasTot)
    + Object.entries(grupos).map(([k, g]) => chip(k, g.ico, `t-${k.toLowerCase()}`, g.n, k === 'BASCULA' ? 'Básculas' : g.nombre, g.alerta)).join('');
  refreshIcons();
}

async function onClick(e) {
  const t = e.target;
  const chip = t.closest('[data-tipo]');
  if (chip && chip.classList.contains('type-card')) {
    root.querySelector('#eq-tipo').value = chip.dataset.tipo;
    root.querySelector('#eq-tipo').dispatchEvent(new Event('change'));
    pintarTipos(); return;
  }
  const b = t.closest('[data-eq],[data-ficha],[data-verif],[data-editar],[data-etq],[data-activo]');
  if (!b) return;
  if (b.dataset.eq === 'nuevo') { if (await abrirFormEquipo()) await recargar(); return; }
  if (b.dataset.eq === 'etiquetas') { await dialogoEtiquetas(todos); return; }
  if (b.dataset.etq) { etiquetaIndividual(todos.find((x) => x.id_calbas === b.dataset.etq)); return; }
  if (b.dataset.activo) { if (await cambiarActivo(todos.find((x) => x.id_calbas === b.dataset.activo))) await recargar(); return; }
  if (b.dataset.eq === 'tipos') { await gestionarTipos(); return; }
  if (b.dataset.ficha) { abrirFicha(b.dataset.ficha); return; }
  if (b.dataset.verif) { navigate(`#/verificar?equipo=${b.dataset.verif}`); return; }
  if (b.dataset.editar) { const eq = todos.find((x) => x.id_calbas === b.dataset.editar); if (await abrirFormEquipo(eq)) await recargar(); }
}

// Activar / inactivar (los inactivos no se verifican ni generan avisos, pero conservan su historial)
async function cambiarActivo(e) {
  if (!e) return false;
  const activar = !e.activo_calbas;
  const ok = await confirmDialog({
    title: `${activar ? 'Activar' : 'Inactivar'} ${e.codigo_calbas}`,
    message: activar ? 'El equipo volverá a aparecer para verificar y en los avisos.' : 'El equipo dejará de aparecer para verificar y en los avisos. Su historial se conserva y puedes activarlo de nuevo cuando quieras.',
    confirmText: activar ? 'Activar' : 'Inactivar', danger: !activar,
  });
  if (!ok) return false;
  try {
    if (e.origen_calbas === 'bascula') must(await sb.from('basculas_calbas').update({ activa_calbas: activar }).eq('id_calbas', e.id_calbas));
    else must(await sb.from('equipos_calbas').update({ activo_calbas: activar }).eq('id_calbas', e.id_calbas));
    toast(`${e.codigo_calbas} ${activar ? 'activado' : 'inactivado'}.`, 'success');
    return true;
  } catch (err) { toast(errMsg(err), 'error'); return false; }
}

// ---------------- Ficha técnica ----------------
async function abrirFicha(id) {
  let e = todos.find((x) => x.id_calbas === id);
  if (!e) { const { data } = await sb.from('vw_equipos_calbas').select('*').eq('id_calbas', id).maybeSingle(); e = data; }
  if (!e) { toast('No se encontró el equipo.', 'warning'); return; }
  const [{ data: ver }, { data: cal }, det] = await Promise.all([
    sb.from('vw_verificaciones_todas_calbas').select('*').eq('equipo_id_calbas', id).order('fecha_calbas', { ascending: false }).order('created_at_calbas', { ascending: false }).limit(8),
    sb.from('vw_calibraciones_todas_calbas').select('*').eq('equipo_id_calbas', id).order('fecha_calibracion_calbas', { ascending: false }).limit(6),
    e.origen_calbas === 'bascula' ? sb.from('basculas_calbas').select('*').eq('id_calbas', id).maybeSingle() : sb.from('equipos_calbas').select('*').eq('id_calbas', id).maybeSingle(),
  ]);
  const d = det.data || {};
  const tipoFicha = e.origen_calbas === 'equipo' ? (await getTipos()).find((t) => t.clave_calbas === e.tipo_clave_calbas) : null;
  const u = U(d.unidad_calbas || e.unidad_calbas);
  const tec = e.origen_calbas === 'bascula'
    ? [['Clase de exactitud', CLASES[d.clase_exactitud_calbas]], ['Capacidad', `${fmtVal(d.capacidad_minima_calbas)} – ${fmtVal(d.capacidad_maxima_calbas)} ${u}`],
       ['División mínima (d)', `${fmtVal(d.division_minima_calbas)} ${u}`], ['División de verificación (e)', `${fmtVal(d.division_verificacion_e_calbas)} ${u}`],
       ['Criterio configurado', CRITERIOS[d.criterio_evaluacion_calbas]], ['Unidad de la báscula', u]]
    : [['Método', METODOS[tipoFicha?.metodo_calbas]?.[0] || '—'], ['Magnitud', e.magnitud_calbas], ...(tipoFicha?.puntos_referencia_calbas ? [['Puntos de referencia', tipoFicha.puntos_referencia_calbas.map((x) => fmtVal(x)).join(' / ')]] : []), ['Rango', d.rango_max_calbas != null ? `${fmtVal(d.rango_min_calbas ?? 0)} – ${fmtVal(d.rango_max_calbas)} ${u}` : '—'],
       ['Resolución', d.resolucion_calbas ? `${fmtVal(d.resolucion_calbas)} ${u}` : '—'],
       ['Tolerancia', d.tolerancia_tipo_calbas === 'PORCENTAJE' ? `± ${fmtVal(d.tolerancia_calbas)} % de la referencia` : `± ${fmtVal(d.tolerancia_calbas)} ${u}`],
       ['Calibrar cada', `${d.frecuencia_calibracion_dias_calbas} días`]];
  const gen = [['Departamento', e.departamento_calbas], ['Ubicación', e.ubicacion_calbas], ['Marca', e.marca_calbas], ['Modelo', e.modelo_calbas],
    ['Número de serie', e.numero_serie_calbas], ['Verificar cada', e.frecuencia_verificacion_dias_calbas === 1 ? 'Diario' : `${e.frecuencia_verificacion_dias_calbas} días`]];
  const tiles = (rows) => `<dl class="info-tiles">${rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v || '—')}</dd></div>`).join('')}</dl>`;
  // En básculas el promedio se muestra en la unidad de la pesa patrón
  const prom = (v) => (v.referencias_calbas ? `${[v.lectura_1_calbas, v.lectura_2_calbas, v.lectura_3_calbas].filter((x) => x != null).map((x) => fmtVal(x)).join(' / ')} ${U(v.unidad_calbas)}` : v.origen_calbas === 'bascula' ? `${fmtVal(convertirMasa(v.promedio_lecturas_calbas, v.unidad_calbas, v.unidad_referencia_calbas))} ${U(v.unidad_referencia_calbas)}` : `${fmtVal(v.promedio_lecturas_calbas)} ${U(v.unidad_calbas)}`);
  const ult = ver?.find((v) => v.estado_calbas === 'vigente');
  const stat = (cls, ico, label, value, sub) => `<div class="ficha-stat ${cls}"><span class="fs-ico">${icon(ico)}</span><div><small>${esc(label)}</small><b>${esc(value)}</b><span>${esc(sub)}</span></div></div>`;
  const dCal = e.dias_calibracion_calbas;
  await openModal({
    title: `${e.codigo_calbas} · ${e.tipo_nombre_calbas}`,
    subtitle: [e.ubicacion_calbas, e.departamento_calbas].filter(Boolean).join(' · '), size: 'lg',
    body: `<div class="ficha-hero">
        <span class="eq-ico xl ilus t-${esc(e.tipo_clave_calbas.toLowerCase())}">${emoji(ilusTipo(e))}</span>
        <div class="fh-txt"><b>${esc(e.codigo_calbas)}</b><span>${esc([e.tipo_nombre_calbas, e.departamento_calbas, e.ubicacion_calbas].filter(Boolean).join(' · '))}</span>
          <div class="ficha-status">${verPill(e.estado_verificacion_calbas)} ${calPill(e.estado_calibracion_calbas)} ${e.activo_calbas ? pillIlus('Activo', 'info', 'activo') : pillIlus('Inactivo', 'gray', 'inactivo')}</div></div>
        <div class="fh-actions">
          ${e.activo_calbas && e.requiere_verificacion_calbas !== false ? `<button type="button" class="btn orange sm" data-go="#/verificar?equipo=${e.id_calbas}">${icon('clipboard-plus')} Verificar</button>` : ''}
          <button type="button" class="btn teal sm" data-go="#/historial?equipo=${e.id_calbas}">${icon('history')} Historial</button>
          ${state.isAdmin ? `<button type="button" class="btn outline sm" data-fetq>${icon('tag')} Etiqueta</button>
          <button type="button" class="btn secondary sm" data-factivo>${icon(e.activo_calbas ? 'power-off' : 'power')} ${e.activo_calbas ? 'Inactivar' : 'Activar'}</button>` : ''}
        </div>
      </div>
      <div class="ficha-stats">
        ${stat(ult ? (ult.dictamen_calbas === 'CUMPLE' ? 'ok' : 'bad') : 'gray', 'clipboard-check', 'Última verificación', ult ? fmtDate(ult.fecha_calbas) : 'Nunca', ult ? (ult.dictamen_calbas === 'CUMPLE' ? 'Cumple' : 'No cumple') : 'Sin registros')}
        ${stat(e.estado_verificacion_calbas === 'vencida' ? 'bad' : 'info', 'calendar-clock', 'Próxima verificación', e.proxima_verificacion_calbas ? fmtDate(e.proxima_verificacion_calbas) : 'Pendiente', e.estado_verificacion_calbas === 'vencida' ? 'Atrasada' : 'Según frecuencia')}
        ${stat(e.estado_calibracion_calbas === 'vencida' ? 'bad' : e.estado_calibracion_calbas === 'por_vencer' ? 'warn' : e.estado_calibracion_calbas === 'vigente' ? 'ok' : 'gray', 'badge-check', 'Calibración vence', e.vencimiento_calibracion_calbas ? fmtDate(e.vencimiento_calibracion_calbas) : 'Sin certificado',
          dCal == null ? 'Registra un certificado' : dCal < 0 ? `Vencida hace ${-dCal} días` : `En ${dCal} días`)}
      </div>
      <div class="ficha-cols">
        <section class="ficha-card"><h4>${icon('info')} Datos generales</h4>${tiles(gen)}</section>
        <section class="ficha-card"><h4>${icon('ruler')} Parámetros metrológicos</h4>${tiles(tec)}</section>
      </div>
      <section class="ficha-card mt"><h4>${icon('clipboard-list')} Últimas verificaciones</h4>
      ${ver?.length ? `<div class="table-wrap"><table class="table compact"><thead><tr><th>Fecha</th><th>Patrón</th><th>Lectura</th><th>Error</th><th>Tolerancia</th><th>Dictamen</th></tr></thead><tbody>
        ${ver.map((v) => `<tr><td>${fmtDate(v.fecha_calbas)}</td><td class="mono">${v.referencias_calbas ? v.referencias_calbas.map((x) => fmtVal(x)).join(" / ") : fmtVal(v.valor_referencia_calbas)} ${esc(U(v.unidad_referencia_calbas))}</td><td class="mono">${esc(prom(v))}</td>
          <td class="mono">${fmtSigned(v.error_calbas)} ${esc(U(v.unidad_calculo_calbas))}</td><td class="mono">± ${fmtVal(v.tolerancia_calbas, 4)} ${esc(U(v.unidad_calculo_calbas))}</td><td>${dictamenConAjuste(v)}</td></tr>`).join('')}</tbody></table></div>`
        : '<p class="hint center">Aún no hay verificaciones registradas.</p>'}</section>
      <section class="ficha-card mt"><h4>${icon('file-badge')} Calibraciones</h4>
      ${cal?.length ? `<div class="table-wrap"><table class="table compact"><thead><tr><th>Calibración</th><th>Vence</th><th>Certificado</th><th>Laboratorio</th><th>Archivo</th></tr></thead><tbody>
        ${cal.map((c) => `<tr><td>${fmtDate(c.fecha_calibracion_calbas)}</td><td>${fmtDate(c.fecha_vencimiento_calbas)}</td><td>${esc(c.numero_certificado_calbas || '—')}</td><td>${esc(c.proveedor_laboratorio_calbas || '—')}</td>
          <td>${c.archivo_url_calbas ? `<button type="button" class="btn teal sm" data-cert="${esc(c.archivo_url_calbas)}">${icon('paperclip')} Ver</button>` : '—'}</td></tr>`).join('')}</tbody></table></div>`
        : '<p class="hint center">Sin calibraciones registradas.</p>'}</section>`,
    onOpen: ({ wrap, close }) => {
      wrap.addEventListener('click', (ev) => {
        const c = ev.target.closest('[data-cert]'); if (c) abrirCertificado(c.dataset.cert);
        const g = ev.target.closest('[data-go]'); if (g) { close(); navigate(g.dataset.go); }
        if (ev.target.closest('[data-fetq]')) etiquetaIndividual(e);
        if (ev.target.closest('[data-factivo]')) { close(); cambiarActivo(e).then((ok) => { if (ok && root) recargar(); }); }
      });
    },
  });
}

// ---------------- Alta / edición ----------------
async function abrirFormEquipo(eq = null) {
  const tipos = await getTipos();
  const deptos = (await getDepartamentos()).filter((d) => d.activo_calbas || d.id_calbas === eq?.departamento_id_calbas);
  let tipo = eq ? tipos.find((t) => t.clave_calbas === eq.tipo_clave_calbas) : null;
  if (!tipo) {
    tipo = await openModal({
      title: 'Nuevo equipo', subtitle: 'Selecciona el tipo de instrumento a registrar.', size: 'md', confirmDiscard: false, submitText: 'Continuar',
      body: `<div class="tipo-grid">${tipos.filter((t) => t.activo_calbas !== false).map((t, i) => `<label class="tipo-opt"><input type="radio" name="tipo" value="${esc(t.clave_calbas)}" ${i === 0 ? 'checked' : ''}>
        <span class="tipo-card"><span class="eq-ico lg ilus t-${esc(t.clave_calbas.toLowerCase())}">${emoji(ilusTipo(t))}</span>
          <span class="tipo-txt"><b>${esc(t.nombre_calbas)}</b><span>${esc(t.magnitud_calbas)} · ${esc(t.unidades_calbas.map(U).join(', '))}</span></span>
          <span class="tipo-check">${icon('check')}</span></span></label>`).join('')}</div>`,
      onSubmit: ({ form }) => tipos.find((t) => t.clave_calbas === form.elements.tipo.value),
    });
    if (!tipo) return false;
  }
  const d = eq ? (await (eq.origen_calbas === 'bascula'
    ? sb.from('basculas_calbas').select('*').eq('id_calbas', eq.id_calbas).single()
    : sb.from('equipos_calbas').select('*').eq('id_calbas', eq.id_calbas).single()).then(must)).data : {};
  return tipo.clave_calbas === 'BASCULA' ? formBascula(d, deptos) : formGenerico(d, tipo, deptos);
}

const deptoOpts = (deptos, sel) => `<option value="">Selecciona…</option>${deptos.map((x) => `<option value="${esc(x.id_calbas)}" ${x.id_calbas === sel ? 'selected' : ''}>${esc(x.nombre_calbas)}</option>`).join('')}`;
// Campo con etiqueta, ayuda opcional y sufijo de unidad
const fld = (name, label, val, attrs = '', req = false, ayuda = '', sufijo = '') => `<div class="field"><label for="f-${name}">${esc(label)}${req ? ' <span class="req">*</span>' : ''}</label>
  <div class="${sufijo ? 'input-suffix' : ''}"><input id="f-${name}" name="${name}" value="${esc(val ?? '')}" ${req ? 'required' : ''} ${attrs}>${sufijo ? `<span class="sfx" data-sfx>${esc(sufijo)}</span>` : ''}</div>
  ${ayuda ? `<small class="hint">${esc(ayuda)}</small>` : ''}</div>`;
// «data-neg»: admite negativos; sin inputmode="decimal" porque ese teclado del celular no trae el signo «−»
const num = (name, label, val, req = false, extra = '', ayuda = '', sufijo = '') => fld(name, label, val, `type="number" step="any" ${extra.includes('data-neg') ? '' : 'inputmode="decimal"'} ${extra}`, req, ayuda, sufijo);

function leerGenerico() {
  const f = root.querySelector('#vf').elements;
  const num = (x) => (x === undefined || x === null || x === '' ? null : Number(x));
  const ajuste = !!f.ajuste?.checked;
  if (ctx.metodo === 'MULTIPUNTO') {
    const n = (ctx.tipo.puntos_referencia_calbas || []).length;
    const refs = [], lect = [], post = [], usado = [], pbs = [];
    for (let i = 0; i < n; i++) {
      refs.push(num(f[`ref${i}`]?.value)); lect.push(num(f[`l${i + 1}`]?.value)); post.push(num(f[`post${i}`]?.value));
      pbs.push(f[`pb${i}`]?.value || null);
      usado.push(!bufferOpcional(i, n) || lect[i] != null);
    }
    const sel = (a) => a.filter((_, i) => usado[i]);
    return { f, ajuste, refs, lect, post, usado, sel, pbs };
  }
  const lect = ['l1', 'l2', 'l3'].map((k) => num(f[k]?.value));
  return { f, ajuste, ref: num(f.ref?.value), lect, post: [num(f.post0?.value)], cor: num(f.correccion?.value) };
}
const tolDe = (e, ref) => (e.tolerancia_tipo_calbas === 'PORCENTAJE' ? Math.abs(ref) * e.tolerancia_calbas / 100 : Number(e.tolerancia_calbas));

// Criterio aplicable a una báscula (refleja validar_verificacion_calbas)
function criterioBascula(fecha) {
  const { b, ver, cal } = ctx;
  const now = Date.now();
  const cals = cal.filter((c) => c.fecha_calibracion_calbas <= fecha && Date.parse(c.created_at_calbas) <= now)
    .sort((x, y) => x.fecha_calibracion_calbas.localeCompare(y.fecha_calibracion_calbas) || x.created_at_calbas.localeCompare(y.created_at_calbas));
  const ult = cals[cals.length - 1];
  const previas = ver.filter((v) => v.fecha_calbas <= fecha && (!ult || (v.fecha_calbas >= ult.fecha_calibracion_calbas && Date.parse(v.created_at_calbas) > Date.parse(ult.created_at_calbas))));
  if (previas.length) return 'EN_SERVICIO';
  if (ult) return 'VERIFICACION_INICIAL';
  return b.criterio_evaluacion_calbas === 'EN_SERVICIO' ? 'EN_SERVICIO' : 'VERIFICACION_INICIAL';
}

function leer() {
  const f = root.querySelector('#vf').elements;
  const raw = ['l1', 'l2', 'l3'].map((k) => f[k]?.value ?? '');
  const est = raw.every((x) => x !== '') ? estadistica(raw) : null;
  return { f, est, lecturas: raw.map(Number) };
}

function preview() {
  const box = root?.querySelector('#v-prev');
  if (!box) return;
  const card = (estado, items, nota) => {
    // Ilustración del resultado; solo se anima cuando el resultado cambia (no en cada tecla)
    const res = estado.includes('pill ok') ? 'cumple' : estado.includes('pill bad') ? (/ajuste: cumple/.test(nota) ? 'ajustado' : 'no_cumple') : '';
    if (res && res !== box.dataset.res) box.dataset.t = Date.now();
    box.dataset.res = res;
    // Si se vuelve a pintar mientras anima (siguiente tecla), la animación continúa donde iba
    const ms = Date.now() - Number(box.dataset.t || 0), anima = res && ms < 450;
    box.innerHTML = `<div class="prev-head">${res ? `<span class="prev-ilus ${anima ? 'cambia' : ''}"${anima ? ` style="--retraso:-${ms}ms"` : ''}>${emoji(res)}</span>` : ''}<div><span class="eyebrow">Vista previa</span><h3>Resultado metrológico</h3></div>${estado}</div>
      <div class="prev-grid">${items.map(([k, v, s]) => `<div class="prev-item"><small>${esc(k)}</small><b class="mono">${esc(v)}</b>${s ? `<span>${esc(s)}</span>` : ''}</div>`).join('')}</div>
      <p class="hint">${esc(nota)}</p>`;
    refreshIcons();
  };
  const pend = pill('Pendiente', 'gray');
  if (!eq) return card(pend, [['Equipo', '—'], ['Promedio', '—'], ['Error', '—'], ['Tolerancia', '—']], 'Selecciona un equipo para comenzar.');
  const { f, est } = leer();
  const avg = root.querySelector('#v-avg');
  if (ctx.metodo === 'SOLO_CALIBRACION') return card(pill('No aplica', 'info'), [['Equipo', eq.codigo_calbas]], 'Este equipo solo lleva calibraciones externas.');
  if (!f.patron && !f.pb0) return card(pend, [['Equipo', eq.codigo_calbas]], 'Cargando datos del equipo…');
  try {
    if (eq.origen_calbas === 'bascula') {
      const { b } = ctx;
      const crit = criterioBascula(f.fecha.value || todayISO());
      const p = ctx.pesas.find((x) => x.id_calbas === f.patron.value);
      const uL = p ? p.unidad_calbas : b.unidad_calbas;
      if (avg) avg.textContent = est ? `${fmtVal(est.prom)} ${U(uL)}` : '—';
      const base = [['Clase / criterio', CLASES[b.clase_exactitud_calbas], CRITERIOS[crit]], ['Promedio', est ? `${fmtVal(est.prom)} ${U(uL)}` : '—', 'En la unidad de la pesa patrón']];
      if (!p) return card(pend, base, 'Selecciona una pesa patrón para calcular el EMT.');
      const patG = aGramos(p.valor_nominal_calbas, p.unidad_calbas), eG = aGramos(b.division_verificacion_e_calbas, b.unidad_calbas);
      const div = patG / eG, fac = factorEMT(b.clase_exactitud_calbas, crit, div), emt = eG * fac;
      base.push(['Divisiones de carga (m/e)', fmtVal(div, 2), `Factor ${fmtVal(fac)}`], ['EMT permitido', `± ${fmtVal(emt, 4)} g`]);
      if (!est) return card(pend, base, 'Captura las tres lecturas para determinar el error y el dictamen.');
      const err = aGramos(est.prom, uL) - patG, ok = Math.abs(err) <= emt;
      base.push(['Error de indicación', `${fmtSigned(err)} g`, `${fmtVal(Math.abs(err) / emt * 100, 1)} % del EMT`]);
      const bajoMin = b.capacidad_minima_calbas && patG < aGramos(b.capacidad_minima_calbas, b.unidad_calbas);
      return card(dictamenPill(ok ? 'CUMPLE' : 'NO_CUMPLE'), base, `${bajoMin ? `⚠ La pesa patrón está por debajo de la capacidad mínima de la báscula (${fmtVal(b.capacidad_minima_calbas)} ${U(b.unidad_calbas)}); usa una pesa mayor para una verificación representativa. ` : ''}Dictamen orientativo. La base de datos lo recalcula al guardar.`);
    }
    const { e } = ctx;
    const ue = U(e.unidad_calbas);
    const tolTxt = e.tolerancia_tipo_calbas === 'PORCENTAJE' ? `± ${fmtVal(e.tolerancia_calbas)} %` : `± ${fmtVal(e.tolerancia_calbas, 4)} ${ue}`;
    const g = leerGenerico();
    const estadoPt = (d, tol) => (d == null ? pill('Pendiente', 'gray') : Math.abs(d) <= tol + 1e-12 ? pill('Cumple', 'ok') : pill('Fuera', 'bad'));
    const finalTxt = (ok) => (ok == null ? '' : ok ? ' · después del ajuste: cumple' : ' · después del ajuste: no cumple');
    if (ctx.metodo === 'MULTIPUNTO') {
      let ok = true, todos = true, maxD = null, okPost = null, todosPost = g.ajuste;
      g.refs.forEach((r, i) => {
        const row = root.querySelector(`[data-pt="${i}"]`), l = g.lect[i];
        const prow0 = root.querySelector(`[data-post-row="${i}"]`);
        prow0?.classList.toggle('hidden', !g.usado[i]);
        if (!g.usado[i]) { row.querySelector('[data-dev]').textContent = '—'; row.querySelector('[data-st]').innerHTML = pill('No se usó', 'gray'); return; }
        const d = r == null || l == null ? null : l - r, tol = r == null ? 0 : tolDe(e, r);
        if (d == null) todos = false; else { if (Math.abs(d) > tol + 1e-12) ok = false; if (maxD == null || Math.abs(d) > Math.abs(maxD)) maxD = d; }
        row.querySelector('[data-dev]').textContent = d == null ? '—' : fmtSigned(d, 4);
        row.querySelector('[data-st]').innerHTML = estadoPt(d, tol);
        const prow = root.querySelector(`[data-post-row="${i}"]`), p = g.post[i];
        const dp = r == null || p == null ? null : p - r;
        if (prow) { prow.querySelector('[data-dev]').textContent = dp == null ? '—' : fmtSigned(dp, 4); prow.querySelector('[data-st]').innerHTML = estadoPt(dp, tol); }
        if (g.ajuste) { if (dp == null) todosPost = false; else okPost = (okPost ?? true) && Math.abs(dp) <= tol + 1e-12; }
      });
      const base = [['Buffers', g.sel(g.refs).map((r) => fmtVal(r)).join(' / ')], ['Tolerancia por buffer', tolTxt],
        ['Mayor desviación', maxD == null ? '—' : `${fmtSigned(maxD, 4)} ${ue}`]];
      if (g.ajuste) base.push(['Después del ajuste', todosPost ? (okPost ? 'Todos en tolerancia' : 'Aún fuera de tolerancia') : 'Captura las lecturas']);
      if (!todos) return card(pend, base, 'Captura la lectura del equipo en cada buffer.');
      return card(dictamenPill(ok ? 'CUMPLE' : 'NO_CUMPLE'), base, `Dictamen «como se encontró»${finalTxt(g.ajuste && todosPost ? okPost : null)}. La base de datos lo recalcula al guardar.`);
    }
    // PUNTO_UNICO
    const ls = g.lect.filter((x) => x != null);
    const prom = ls.length ? ls.reduce((s, x) => s + x, 0) / ls.length : null;
    const d = g.ref == null || prom == null ? null : prom - g.ref;
    const tol = g.ref == null ? null : tolDe(e, g.ref);
    root.querySelector('#v-dev b').textContent = d == null ? '—' : `${fmtSigned(d, 4)} ${ue}`;
    root.querySelector('#v-dev').className = `dev-strip ${d == null ? '' : Math.abs(d) < 1e-9 ? 'ok' : Math.abs(d) <= tol + 1e-12 ? 'warn' : 'bad'}`;
    const p = g.post[0], df = g.ref == null || p == null ? null : p - g.ref;
    const fin = root.querySelector('#v-dev-fin');
    if (fin) { fin.querySelector('b').textContent = df == null ? '—' : `${fmtSigned(df, 4)} ${ue}`; fin.className = `dev-strip full ${df == null ? '' : Math.abs(df) < 1e-9 ? 'ok' : Math.abs(df) <= tol + 1e-12 ? 'warn' : 'bad'}`; }
    const base = [['Medición patrón', g.ref == null ? '—' : `${fmtVal(g.ref)} ${ue}`], ['Medición del equipo', prom == null ? '—' : `${fmtVal(prom)} ${ue}`, ls.length > 1 ? `Promedio de ${ls.length} lecturas` : ''],
      ['Desviación', d == null ? '—' : `${fmtSigned(d, 4)} ${ue}`], ['Tolerancia', tolTxt]];
    if (g.ajuste) base.push(['Corrección aplicada', g.cor == null ? '—' : `${fmtSigned(g.cor, 4)} ${ue}`], ['Desviación final', df == null ? '—' : `${fmtSigned(df, 4)} ${ue}`]);
    if (d == null) return card(pend, base, 'Captura la medición patrón y la del equipo.');
    const ok = Math.abs(d) <= tol + 1e-12;
    const nota = !g.ajuste && Math.abs(d) > 1e-9 ? 'Hay desviación: si corriges el equipo, marca «Se aplicó corrección» y registra la lectura final. ' : '';
    return card(dictamenPill(ok ? 'CUMPLE' : 'NO_CUMPLE'), base, `${nota}Dictamen «como se encontró»${finalTxt(g.ajuste && df != null ? Math.abs(df) <= tol + 1e-12 : null)}. La base de datos lo recalcula al guardar.`);
  } catch (err) { return card(pend, [['Equipo', eq.codigo_calbas]], err.message); }
}

async function guardar(ev) {
  ev.preventDefault();
  const form = ev.currentTarget;
  if (!eq) { toast('Selecciona un equipo.', 'warning'); return; }
  if (eq.origen_calbas !== 'bascula' && ctx.metodo === 'SOLO_CALIBRACION') { toast('Este equipo no lleva verificación interna.', 'warning'); return; }
  // El buffer opcional sin lectura tampoco pide lectura después del ajuste
  if (eq.origen_calbas !== 'bascula' && ctx.metodo === 'MULTIPUNTO') {
    const g = leerGenerico();
    g.usado.forEach((u, i) => {
      const p = form.elements[`post${i}`]; if (p) p.required = g.ajuste && u;
      const pb = form.elements[`pb${i}`]; if (pb) pb.required = u;
    });
  }
  if (!checkForm(form)) return;
  const { f, est, lecturas } = leer();
  if (eq.origen_calbas === 'bascula' && !est) { toast('Captura las tres lecturas.', 'warning'); return; }
  const btn = root.querySelector('#v-save');
  btn.disabled = true; btn.innerHTML = '<span class="spinner sm"></span> Registrando…';
  try {
    let r;
    if (eq.origen_calbas === 'bascula') {
      // Las lecturas se capturan en la unidad de la pesa y se guardan en la de la báscula
      const pesa = ctx.pesas.find((p) => p.id_calbas === f.patron.value);
      const aBas = (x) => Math.round(convertirMasa(x, pesa.unidad_calbas, ctx.b.unidad_calbas) * 1e6) / 1e6;
      const l = lecturas.map(aBas), prom = Math.round(((l[0] + l[1] + l[2]) / 3) * 1e6) / 1e6;
      r = must(await sb.from('verificaciones_calbas').insert({
        bascula_id_calbas: eq.id_calbas, departamento_id_calbas: eq.departamento_id_calbas, pesa_patron_id_calbas: f.patron.value,
        pesa_patron_valor_calbas: pesa.valor_nominal_calbas,
        lectura_1_calbas: l[0], lectura_2_calbas: l[1], lectura_3_calbas: l[2], promedio_lecturas_calbas: prom, peso_real_calbas: prom,
        unidad_calbas: ctx.b.unidad_calbas, fecha_calbas: f.fecha.value, observaciones_calbas: f.obs.value.trim() || null, etiqueta_danada_calbas: f.etiqueta.checked,
      }).select('id_calbas, dictamen_calbas, error_indicacion_calbas, emt_permitido_calbas').single()).data;
      if (r.dictamen_calbas === 'NO_CUMPLE') avisar({ accion: 'no_cumple', origen: 'bascula', id: r.id_calbas });
    } else {
      const g = leerGenerico();
      const row = { equipo_id_calbas: eq.id_calbas, departamento_id_calbas: eq.departamento_id_calbas, patron_id_calbas: ctx.metodo === 'MULTIPUNTO' ? g.sel(g.pbs)[0] : f.patron.value,
        fecha_calbas: f.fecha.value, observaciones_calbas: f.obs.value.trim() || null, ajuste_realizado_calbas: g.ajuste, etiqueta_danada_calbas: f.etiqueta.checked };
      if (ctx.metodo === 'MULTIPUNTO') {
        const refs = g.sel(g.refs), lect = g.sel(g.lect);
        Object.assign(row, { referencias_calbas: refs, valor_referencia_calbas: refs[0], temperatura_calbas: f.temp.value === '' ? null : Number(f.temp.value),
          lectura_1_calbas: lect[0], lectura_2_calbas: lect[1] ?? null, lectura_3_calbas: lect[2] ?? null,
          lecturas_post_calbas: g.ajuste ? g.sel(g.post) : null, patrones_buffers_calbas: g.sel(g.pbs) });

  const body = root.querySelector('#dash-body');
  body.innerHTML = `<div class="grid grid-4">${'<div class="kpi"><div class="skeleton" style="width:60%"></div><div class="skeleton" style="height:30px;width:40%"></div></div>'.repeat(4)}</div>`;
  const hoy = todayISO(), inicio = `${addDays(hoy, -180).slice(0, 7)}-01`;
  try {
    const [eqs, ver, alertas, nc] = await Promise.all([
      cargarEquipos(),
      sb.from('vw_verificaciones_todas_calbas').select('fecha_calbas, dictamen_calbas, tipo_clave_calbas').eq('estado_calbas', 'vigente').gte('fecha_calbas', inicio).limit(5000).then(must),
      sb.from('vw_alertas_tendencia_calbas').select('*').then((r) => r).catch(() => ({ data: [] })),
      sb.from('vw_no_cumple_calbas').select('id_calbas, estado_seguimiento_calbas').neq('estado_seguimiento_calbas', 'cerrado').then((r) => r).catch(() => ({ data: [] })),
    ]);
    if (t !== token || !root) return;
    const activos = eqs.filter((e) => e.activo_calbas);
    const mes = hoy.slice(0, 7);
    const verMes = ver.data.filter((v) => v.fecha_calbas.startsWith(mes));
    const ncMes = verMes.filter((v) => v.dictamen_calbas === 'NO_CUMPLE').length;
    const pendientes = activos.filter((e) => ['vencida', 'sin_registro', 'por_vencer'].includes(e.estado_verificacion_calbas));
    const calAlert = activos.filter((e) => ['vencida', 'por_vencer'].includes(e.estado_calibracion_calbas));
    const calVig = activos.filter((e) => ['vigente', 'por_vencer'].includes(e.estado_calibracion_calbas));
    const calPorVencer = activos.filter((e) => e.estado_calibracion_calbas === 'por_vencer').length;
    const calVenc = activos.filter((e) => e.estado_calibracion_calbas === 'vencida').length;
    const tendencia = (alertas.data || []).filter((a) => a.alerta_tendencia_calbas);
    const sinCerrar = nc.data || [];
    const sinSeg = sinCerrar.filter((x) => x.estado_seguimiento_calbas === 'sin_seguimiento').length;
    const conformes = verMes.length ? Math.round(((verMes.length - ncMes) / verMes.length) * 100) : null;
    const nTipos = new Set(activos.map((e) => e.tipo_clave_calbas)).size;

    destroyCharts();
    body.innerHTML = `
      <div class="grid grid-4 kx-grid" id="d-kpis">
        ${kpiHTML({ tono: 'blue', ilus: 'n_equipos', label: 'Equipos activos', valor: fmtNum(activos.length), desc: `${nTipos} ${nTipos === 1 ? 'tipo' : 'tipos'} de instrumento`, go: '#/equipos' })}
        ${kpiHTML({ tono: 'orange', ilus: 'n_verificar', label: 'Verificaciones mensuales', valor: fmtNum(verMes.length), desc: conformes === null ? 'Sin registros este mes' : `${conformes} % conformes este mes`, go: '#/historial', barra: conformes })}
        ${kpiHTML({ tono: 'green', ilus: 'cal_vigente', label: 'Calibraciones vigentes', valor: fmtNum(calVig.length), desc: calPorVencer ? `${calPorVencer} por vencer en 30 días` : `De ${activos.length} equipos activos`, go: '#/calibraciones?estado=vigente' })}
        ${kpiHTML({ tono: calVenc ? 'red' : 'violet', ilus: 'cal_vencida', label: 'Calibraciones vencidas', valor: fmtNum(calVenc), desc: calVenc ? 'Requieren calibración externa' : 'Ninguna vencida', go: '#/calibraciones?estado=vencida' })}
      </div>
      ${sinCerrar.length || tendencia.length ? `<div class="notice error mt">${icon('triangle-alert')}<span>${sinCerrar.length ? `<b>${sinCerrar.length} ${sinCerrar.length === 1 ? 'verificación «no cumple» sin cerrar' : 'verificaciones «no cumple» sin cerrar'}</b>${sinSeg ? ` (${sinSeg} sin acción correctiva)` : ''}. Registra la acción tomada (ajuste, reparación, calibración o retiro) y ciérrala con su evidencia; el aviso desaparece al cerrarlas. ` : ''}${tendencia.length ? `<b>${tendencia.length} báscula(s) con alerta de tendencia</b> (3 o más «no cumple» en sus últimas 5 verificaciones).` : ''}</span>
        <button class="btn red sm" data-dash="#/historial?seguimiento=pendiente">${icon('wrench')} Dar seguimiento</button></div>` : ''}
      <div class="grid grid-main mt">
        <div class="card">${cardHead('Pendientes de verificación', 'Ordenados por urgencia', `<button class="btn grad-orange" data-dash="#/verificar">${icon('clipboard-plus')} Verificar ahora</button>`)}
          ${listaPendientes(pendientes)}</div>
        <div class="card">${cardHead('Calibraciones próximas', 'Vencidas y por vencer', `<button class="btn grad-teal" data-dash="#/calibraciones">${icon('badge-check')} Ver todas las calibraciones</button>`)}
          ${listaCal(calAlert)}</div>
      </div>
      <div class="grid grid-2 mt">
        ${chartCard('ch-mes', 'Verificaciones por mes', 'Últimos 6 meses · cumple vs. no cumple')}
        ${chartCard('ch-tipo', 'Equipos por tipo', 'Inventario activo')}
      </div>
      <div class="card mt">${cardHead('Estado por departamento', 'Equipos activos, verificaciones al día y calibraciones vigentes')}${deptosHTML(activos)}</div>
      ${quickHTML()}
      ${accesoHTML()}`;
    refreshIcons();
    animarCifras(body.querySelector('#d-kpis'));
    drawCharts(ver.data, activos, inicio);
    sugerirAvisos(body, t);
    if (state.isAdmin) etiquetasDanadas(body, t, activos);
  } catch (err) {
    if (t !== token) return;
    console.error(err);
    body.innerHTML = errorState(err).replace('data-action="retry"', 'data-dash="retry"');
    refreshIcons();
  }
}

const cardHead = (title, sub = '', btn = '') =>
  `<div class="card-head center"><div><h3>${esc(title)}</h3>${sub ? `<p>${esc(sub)}</p>` : ''}</div>${btn}</div>`;
const chartCard = (id, title, sub) =>
  `<div class="card chart-card">${cardHead(title, sub)}<div class="chart-box" tabindex="0" title="Ampliar gráfica"><canvas id="${id}" role="img" aria-label="${esc(title)}"></canvas></div></div>`;
const eqIco = (e) => `<span class="eq-ico sm ilus t-${esc(e.tipo_clave_calbas.toLowerCase())}">${emoji(ilusTipo(e))}</span>`;

function listaPendientes(rows) {
  if (!rows.length) return emptyState({ ico: 'circle-check-big', title: 'Todo al día', text: 'Todos los equipos activos tienen su verificación vigente.' });
  const orden = { vencida: 0, sin_registro: 1, por_vencer: 2 };
  rows = [...rows].sort((a, b) => orden[a.estado_verificacion_calbas] - orden[b.estado_verificacion_calbas] || String(a.proxima_verificacion_calbas).localeCompare(String(b.proxima_verificacion_calbas)));
  return `<div class="list">${rows.slice(0, 7).map((e) => `
    <button class="list-item" data-dash="#/verificar?equipo=${e.id_calbas}" style="text-align:left;cursor:pointer;color:inherit">
      ${eqIco(e)}<div class="li-main"><b>${esc(e.codigo_calbas)} · ${esc(e.tipo_nombre_calbas)}</b>
      <span>${esc(e.departamento_calbas || '')}${e.proxima_verificacion_calbas ? ` · tocaba el ${fmtDate(e.proxima_verificacion_calbas)}` : ' · nunca verificado'}${atraso(e)}</span></div>
      ${verPill(e.estado_verificacion_calbas)}</button>`).join('')}</div>
    ${rows.length > 7 ? `<p class="hint">Y ${rows.length - 7} más en <a href="#/equipos?estado=ver_atrasada">Equipos</a>.</p>` : ''}`;
}

function listaCal(rows) {
  if (!rows.length) return emptyState({ ico: 'badge-check', title: 'Sin vencimientos próximos', text: 'Ninguna calibración vence en los próximos 30 días.' });
  rows = [...rows].sort((a, b) => (a.dias_calibracion_calbas ?? 0) - (b.dias_calibracion_calbas ?? 0));
  return `<div class="list">${rows.slice(0, 7).map((e) => `
    <button class="list-item" data-dash="ficha" data-id="${e.id_calbas}" style="text-align:left;cursor:pointer;color:inherit">
      <div class="date-chip"><small>${esc(monthShort(e.vencimiento_calibracion_calbas))}</small><b>${esc(e.vencimiento_calibracion_calbas.slice(8, 10))}</b></div>
      <div class="li-main"><b>${esc(e.codigo_calbas)} · ${esc(e.tipo_nombre_calbas)}</b><span>${esc(e.proveedor_laboratorio_calbas || 'Laboratorio no registrado')} · ${e.dias_calibracion_calbas < 0 ? `vencida hace ${-e.dias_calibracion_calbas} días` : `vence en ${e.dias_calibracion_calbas} días`}</span></div>
      ${calPill(e.estado_calibracion_calbas)}</button>`).join('')}</div>`;
}

function deptosHTML(activos) {
  const g = {};
  activos.forEach((e) => {
    const d = (g[e.departamento_calbas || 'Sin departamento'] ||= { total: 0, verOk: 0, calOk: 0, nc: 0 });
    d.total++;
    if (e.estado_verificacion_calbas === 'al_dia' || e.estado_verificacion_calbas === 'por_vencer') d.verOk++;
    if (e.estado_calibracion_calbas === 'vigente' || e.estado_calibracion_calbas === 'por_vencer') d.calOk++;
    if (e.ultimo_dictamen_calbas === 'NO_CUMPLE') d.nc++;
  });
  const ent = Object.entries(g).sort((a, b) => a[0].localeCompare(b[0]));
  if (!ent.length) return emptyState({ ico: 'building-2', title: 'Sin equipos' });
  const bar = (n, total) => { const p = total ? Math.round((n / total) * 100) : 0; return `<div class="meter"><span style="width:${p}%" class="${p === 100 ? 'ok' : p >= 70 ? 'warn' : 'bad'}"></span></div><small>${n}/${total} · ${p} %</small>`; };
  return `<div class="dept-status">${ent.map(([n, d]) => `<div class="dept-row">
      <div class="dept-name"><b>${esc(n)}</b><span>${d.total} equipo(s)${d.nc ? ` · ${pill(`${d.nc} no cumple`, 'bad')}` : ''}</span></div>
      <div class="dept-metric"><span>Verificación al día</span>${bar(d.verOk, d.total)}</div>
      <div class="dept-metric"><span>Calibración vigente</span>${bar(d.calOk, d.total)}</div></div>`).join('')}</div>`;
}

function drawCharts(ver, activos, inicio) {
  const meses = [];
  for (let d = inicio; meses.length < 7; d = addDays(`${d.slice(0, 7)}-28`, 5)) meses.push(d.slice(0, 7));
  const cuenta = (m, dic) => ver.filter((v) => v.fecha_calbas.startsWith(m) && v.dictamen_calbas === dic).length;
  const c1 = document.getElementById('ch-mes');
  if (c1) makeChart(c1, {
    type: 'bar',
    data: { labels: meses.map((m) => monthShort(`${m}-15`)), datasets: [
      { label: 'Cumple', data: meses.map((m) => cuenta(m, 'CUMPLE')), backgroundColor: cssVar('--ok') || PALETTE[3], _colores: () => cssVar('--ok') || PALETTE[3], stack: 's' },
      { label: 'No cumple', data: meses.map((m) => cuenta(m, 'NO_CUMPLE')), backgroundColor: cssVar('--bad') || PALETTE[5], _colores: () => cssVar('--bad') || PALETTE[5], stack: 's' },
    ] },
    options: { scales: { x: { stacked: true }, y: { stacked: true } } },
  });
  // Equipos por tipo: cada tipo conserva su color (v8.0); los tipos nuevos usan la paleta categórica
  const tipos = {}, claves = {};
  activos.forEach((e) => { tipos[e.tipo_nombre_calbas] = (tipos[e.tipo_nombre_calbas] || 0) + 1; claves[e.tipo_nombre_calbas] = e.tipo_clave_calbas; });
  const nombres = Object.keys(tipos);
  // Los tipos sin color propio toman la paleta categórica en orden (el primero, azul)
  const colores = () => { let k = 0; return nombres.map((n) => colorTipo(claves[n], ['BASCULA', 'TERMOMETRO', 'POTENCIOMETRO', 'MICROPIPETA'].includes(claves[n]) ? 0 : k++)); };
  const c2 = document.getElementById('ch-tipo');
  if (c2) makeChart(c2, {
    type: 'doughnut',
    data: { labels: nombres, datasets: [{ data: Object.values(tipos), backgroundColor: colores(), _colores: colores, _centro: { valor: fmtNum(activos.length), etiqueta: 'equipos' } }] },
    options: { plugins: { legend: { position: window.innerWidth < 560 ? 'bottom' : 'right' } } },
  });
}

// Invita a activar los avisos push si este dispositivo aún no los tiene
async function sugerirAvisos(body, t) {
  if (prefs.get('calbas.avisos.omitir') === '1' || (await push.estado()) !== 'inactivo' || t !== token) return;
  const n = document.createElement('div');
  n.className = 'notice info avisos-sugerencia';
  n.innerHTML = `${icon('bell-ring')}<span><b>Activa los avisos en este dispositivo.</b> ${state.isAdmin
    ? 'Te avisaremos de las calibraciones por vencer, de las verificaciones con 3 días de atraso y de cada «no cumple».'
    : 'Te avisaremos cada mañana de los equipos que te toca verificar.'}</span>
    <div class="btns"><button class="btn navy sm" data-av="on">${icon('bell-ring')} Activar</button><button class="btn secondary sm" data-av="no">Ahora no</button></div>`;
  body.prepend(n);
  refreshIcons();
  n.querySelector('[data-av="no"]').addEventListener('click', () => { prefs.set('calbas.avisos.omitir', '1'); n.remove(); });
  n.querySelector('[data-av="on"]').addEventListener('click', async (e) => {
    e.currentTarget.disabled = true;
    try { await push.activar(); toast('Avisos activados en este dispositivo.', 'success'); n.remove(); } catch (err) { toast(errMsg(err), 'error'); e.currentTarget.disabled = false; }
  });
}

// Días de atraso; desde 3 días se avisa a los administradores (recordatorios_calbas)
function atraso(e) {
  if (e.estado_verificacion_calbas !== 'vencida' || !e.proxima_verificacion_calbas) return '';
  const d = Math.round((new Date(`${todayISO()}T00:00:00`) - new Date(`${e.proxima_verificacion_calbas}T00:00:00`)) / 864e5);
  return d > 0 ? ` · <b class="${d >= 3 ? 'txt-bad' : ''}">${d} ${d === 1 ? 'día' : 'días'} de atraso</b>` : '';
}

  const ref = body.querySelector('.grid.grid-main');
  ref ? ref.before(card) : body.append(card);

    ok.disabled = true;
    try {
      must(await sb.from('etiquetas_danadas_calbas').update({ reemplazada_at_calbas: new Date().toISOString(), reemplazada_por_calbas: state.session.user.id }).eq('id_calbas', x.id_calbas));

      const n = card.querySelectorAll('.list-item').length, cifra = card.querySelector('.alerta-n');
      if (cifra) cifra.textContent = n;
      if (!card.querySelector('.list-item')) card.remove();
    } catch (err) { toast(errMsg(err), 'error'); ok.disabled = false; }
  });
}

// ---------------- Fotos existentes (bucket «avatares») ----------------
async function elegirFotoExistente() {
  const { data, error } = await sb.storage.from('avatares').list('', { limit: 500, sortBy: { column: 'name', order: 'asc' } });
  if (error) { toast(errMsg(error), 'error'); return null; }
  const fotos = (data || []).filter((f) => /\.(png|jpe?g|webp)$/i.test(f.name));
  if (!fotos.length) { toast('No hay fotos en la carpeta «avatares».', 'warning'); return null; }
  const url = (n) => sb.storage.from('avatares').getPublicUrl(n).data.publicUrl;
  const r = await openModal({
    title: 'Fotos existentes', subtitle: 'Carpeta «avatares» de Supabase Storage. Toca una foto para usarla.', size: 'lg', confirmDiscard: false,
    body: `<div class="toolbar"><div class="search">${icon('search')}<input type="search" id="gal-q" placeholder="Filtrar por nombre" aria-label="Filtrar fotos"></div></div>
      <div class="photo-gallery" id="gal">${fotos.map((f) => `<button type="button" data-url="${esc(url(f.name))}" data-n="${esc(f.name.toLowerCase())}">
        <img src="${esc(url(f.name))}" alt="" loading="lazy"><span>${esc(f.name.replace(/\.[^.]+$/, ''))}</span></button>`).join('')}</div>`,
    onOpen: ({ wrap, close }) => {
      wrap.querySelector('#gal').addEventListener('click', (e) => { const b = e.target.closest('[data-url]'); if (b) close(b.dataset.url); });
      wrap.querySelector('#gal-q').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        wrap.querySelectorAll('#gal [data-n]').forEach((b) => b.classList.toggle('hidden', !b.dataset.n.includes(q)));
      });
    },
  });
  return typeof r === 'string' ? r : null;
}

      'Es la aplicación de **Calidad de proceso de Pet\'s Table** para controlar los equipos de medición: básculas, termómetros, potenciómetros y micropipetas.\nEn ella se registran las **verificaciones internas** (contra un patrón), se consultan las **calibraciones externas** con su certificado y se da seguimiento a los resultados «no cumple», para asegurar que cada medición que se hace en planta sea confiable.'],
    ['¿Cómo entro a la aplicación?',
      'Abre **metrologia-petstable.vercel.app** e inicia sesión con tu **correo de Pet\'s Table y tu contraseña**. Es la misma cuenta que usas en las demás aplicaciones de la empresa (por ejemplo, Servicio Médico o Pruebas industriales).\nPara tenerla siempre a la mano, instálala en tu celular o computadora (consulta la sección **Instalar la aplicación**).'],
    ['Olvidé mi contraseña, ¿qué hago?',
      'En la pantalla de inicio de sesión escribe tu correo y toca **¿Olvidaste tu contraseña?**. Recibirás un correo con un enlace para crear una nueva.\nSi no te llega, revisa la carpeta de correo no deseado o pide ayuda a un administrador.'],
    ['¿Quién tiene acceso?',
      'Por indicación de la administración tienen acceso:\n- **Inspectores de calidad y Jefa de Calidad:** verifican los equipos de todas las áreas.\n- **Administradores:** además gestionan equipos, patrones, calibraciones, usuarios y etiquetas.\nSi tu cuenta muestra «no tiene acceso a Metrología», solicita el alta a un administrador.'],
    ['¿Qué muestra el Panel?',
      'Es la pantalla de inicio. Reúne en un vistazo:\n- **Indicadores:** equipos activos, verificaciones del mes, calibraciones vigentes y vencidas (toca cada uno para ver el detalle).\n- **Pendientes de verificación**, ordenados por urgencia y con los días de atraso.\n- **Calibraciones próximas** a vencer o vencidas.\n- Avisos de verificaciones «no cumple» sin cerrar y, para administradores, las **etiquetas por reemplazar**.'],
    ['Apareció «Hay una nueva versión disponible», ¿qué hago?',
      'Toca **Actualizar**. La aplicación se recarga con las mejoras más recientes sin perder tu sesión. Si estás a la mitad de un registro, termínalo primero y actualiza después.'],
  ] },
  { id: 'verificar', ilus: 'n_verificar', ico: 'clipboard-check', titulo: 'Verificaciones', preguntas: [
    ['¿Cuál es la diferencia entre una verificación y una calibración?',
      '- **Verificación:** prueba interna y frecuente que hace el inspector comparando el equipo contra un **patrón** (pesa, termómetro patrón o solución buffer). Confirma que el equipo sigue midiendo bien entre calibraciones.\n- **Calibración:** servicio externo que realiza un **laboratorio acreditado** y que se respalda con un certificado. Tiene vigencia (normalmente un año).'],
    ['¿Cómo registro una verificación?',
      '- Entra a **Registrar verificación** (o toca **Verificar** en la ficha del equipo o en los pendientes del Panel).\n- Elige el **equipo**; la lista indica tipo, código y ubicación.\n- Selecciona el **patrón** vigente que vas a usar.\n- Captura las **lecturas** que muestra el equipo. La vista previa te indica el resultado antes de guardar.\n- Revisa la fecha, agrega observaciones si las hay y toca **Registrar verificación**.\nEl dictamen definitivo (cumple o no cumple) lo calcula el sistema; no depende de la persona que registra.'],
    ['¿Cómo se verifica una báscula?',
      'Coloca la **pesa patrón** y registra **tres lecturas** en la misma unidad de la pesa (g o Kg); la aplicación hace la conversión a la unidad de la báscula.\nEl resultado se compara contra el **error máximo tolerado (EMT)**, que depende de la clase de exactitud de la báscula y del valor de la pesa. Si la pesa está por debajo de la capacidad mínima de la báscula, verás un aviso para usar una pesa mayor.'],
    ['¿Cómo se verifica un termómetro?',
      'Compara el termómetro contra el **termómetro patrón** en el mismo punto y registra las lecturas.\nSi hay desviación y la corriges, marca que hubo corrección, captura el valor corregido y la **lectura final**. El sistema guarda el resultado «como se encontró» y «como se dejó».'],
    ['¿Cómo se verifica un potenciómetro (pH)?',
      'En **Buffers certificados utilizados** ya vienen seleccionados los patrones de **pH 4.01 y 7.01** (obligatorios) y la temperatura de **25 °C**. El buffer **10.01 es opcional**: si lo usas, elige su patrón y captura su lectura; si no, déjalo vacío.\nRegistra la lectura del equipo en cada buffer. Si el equipo requirió **ajuste**, márcalo y captura las lecturas después del ajuste. Así queda registrado cómo se encontró y cómo se dejó.'],
    ['¿Por qué no aparecen las micropipetas para verificar?',
      'Las micropipetas **no llevan verificación interna**: solo se controlan con su **calibración externa**. Por eso no aparecen en Registrar verificación, pero sí en Equipos y en Calibraciones.'],
    ['¿Cada cuándo se verifica cada equipo y qué significan los estados?',
      'Cada equipo tiene su propia frecuencia (por ejemplo, diaria o semanal). Los estados son:\n- **Al día:** la verificación está vigente.\n- **Próxima:** vence en los próximos 3 días.\n- **Atrasada:** ya pasó la fecha en que tocaba.\n- **Sin verificar:** aún no tiene ninguna verificación.\n- **Solo calibración:** el equipo no requiere verificación interna.'],
    ['Al equipo le tocaba verificación, pero no se usó en todo el día, ¿qué hago?',
      'En **Registrar verificación** elige el equipo y toca **No se usó**. Indica la fecha (hoy o algún día de la última semana) y, si quieres, una observación.\nEse día **no cuenta como atraso** y la próxima verificación se calcula desde esa fecha. Si el equipo se llega a usar, regístrale su verificación normalmente.'],
    ['Me equivoqué al capturar una verificación, ¿puedo editarla?',
      'No. Para conservar la trazabilidad, **una verificación nunca se edita ni se borra**. Avisa a un administrador para que la **anule indicando el motivo** y registra de nuevo la verificación correcta. La anulación queda en la bitácora.'],
    ['¿Para qué sirve la casilla «Etiqueta dañada»?',
      'Márcala al verificar si la etiqueta de identificación del equipo está **rota, ilegible o se desprendió**. Los administradores reciben un aviso y el equipo aparece en su Panel en **Etiquetas por reemplazar** para imprimir una nueva.'],
  ] },
  { id: 'nocumple', ilus: 'no_cumple', ico: 'triangle-alert', titulo: 'Resultados «no cumple»', preguntas: [
    ['¿Qué hago si una verificación sale «no cumple»?',
      '- **Retira el equipo de uso** e identifícalo para que nadie lo utilice.\n- Los administradores reciben un **aviso inmediato**.\n- Registra la **acción correctiva** desde Historial (ajuste, reparación, calibración externa, retiro, re-verificación o baja).\n- Cuando la acción esté terminada, **cierra el seguimiento** con su evidencia. El aviso del Panel desaparece al cerrarlo.'],
    ['¿Cómo registro la acción correctiva?',
      'Entra a **Historial**, filtra por **Seguimiento: pendiente** y abre la verificación. En el cuadro de seguimiento elige la acción, describe lo que se hizo, indica una fecha compromiso y toca **Registrar acción correctiva**. Al concluir, usa **Cerrar seguimiento**.'],
    ['¿Qué significa «cumple después del ajuste»?',
      'El equipo **no cumplía como se encontró**, pero se ajustó o corrigió en el momento y **como se dejó sí cumple**. En ese caso no queda pendiente de seguimiento, aunque el registro conserva ambos resultados.'],
    ['¿Qué es la alerta de tendencia?',
      'Aparece cuando una báscula acumula **3 o más «no cumple» en sus últimas 5 verificaciones**. Indica que el problema es recurrente y conviene programar una revisión o calibración externa.'],
  ] },
  { id: 'equipos', ilus: 'n_equipos', ico: 'gauge', titulo: 'Equipos, patrones y etiquetas', preguntas: [
    ['¿Cómo consulto la información de un equipo?',
      'En **Equipos** toca el ícono de ficha. Verás sus datos generales, parámetros metrológicos, próxima verificación, vigencia de la calibración, sus últimas verificaciones y los certificados. Puedes filtrar por tipo, departamento o estado y buscar por código, marca o serie.'],
    ['¿Qué tipos de báscula hay?',
      '- **Báscula de plataforma:** rango de 0.4 a 200 Kg.\n- **Báscula de mesa:** rango de 0.1 a 15 Kg.\n- **Báscula analítica:** trabaja en gramos (laboratorio).'],
    ['¿Cómo se asignan los códigos de los equipos?',
      'Son **automáticos** y consecutivos por tipo: **BAS-001** para básculas, **TER-01** termómetros, **POT-01** potenciómetros y **MIC-01** micropipetas. Las pesas patrón usan **PP-001**. El código no cambia después del alta y es el que aparece en la etiqueta física.'],
    ['¿Qué son los patrones y por qué no aparece uno al verificar?',
      'Son las referencias contra las que se verifica: **pesas patrón**, termómetros patrón y soluciones buffer. Solo aparecen los patrones **activos y con certificado vigente** del tipo de equipo. Si falta alguno, pide a un administrador que lo registre o actualice en **Patrones**.'],
    ['¿Cómo se imprimen las etiquetas? (administradores)',
      'En **Equipos** toca **Etiquetas** para generar las de todos los equipos o solo de los tipos que elijas; también puedes imprimir la de un solo equipo desde su fila o su ficha. Se descarga un **PDF tamaño carta**.\nAl imprimir elige **tamaño real / 100 %** para respetar las medidas: 54.4 × 16.7 mm en básculas (logotipo, equipo, código y serie) y 24 × 8.3 mm en termómetros, potenciómetros y micropipetas (logotipo y código).'],
    ['¿Qué pasa si inactivo un equipo? (administradores)',
      'Deja de aparecer para verificar y en los avisos, pero **conserva todo su historial**. Puedes activarlo de nuevo en cualquier momento desde el botón de encendido de la tabla o desde su ficha. Usa el filtro de estado **Inactivos** para encontrarlo.'],
  ] },
  { id: 'calibraciones', ilus: 'n_calibraciones', ico: 'badge-check', titulo: 'Calibraciones', preguntas: [
    ['¿Quién registra las calibraciones?',
      'Los **administradores**, con la fecha, el vencimiento, el laboratorio y el **certificado en PDF**. Todos los usuarios pueden consultarlas y abrir el certificado.'],
    ['¿Qué significan los estados de calibración?',
      '- **Vigente:** el certificado está en vigor.\n- **Por vencer:** vence en los próximos 30 días; conviene programar el servicio.\n- **Vencida:** el equipo requiere calibración externa.\n- **Sin registro:** no hay certificado capturado.'],
    ['¿Puedo exportar la información?',
      'Sí. En **Historial** y en **Calibraciones** usa **Exportar a Excel (CSV)** para descargar los registros con los filtros que tengas aplicados.'],

  { id: 'avisos', ilus: 'n_avisos', ico: 'bell-ring', titulo: 'Avisos y notificaciones', preguntas: [
    ['¿Qué avisos envía la aplicación?',
      'De lunes a viernes a las **8:00 a. m.**, excepto días festivos (los oficiales y los que agregue la administración en **Mi perfil → Días festivos**):\n- **Quienes verifican:** los equipos que ya toca verificar y los atrasados.\n- **Administradores:** calibraciones por vencer o vencidas y verificaciones con **3 días o más de atraso**.\nAdemás, al momento: cada **«no cumple»** y cada **etiqueta dañada** se avisa a los administradores.'],
    ['¿Cómo activo los avisos?',
      'Entra a **Mi perfil → Avisos en este dispositivo** y toca **Activar avisos**; acepta el permiso del navegador. Hazlo **en cada dispositivo** donde quieras recibirlos. Con **Enviar aviso de prueba** confirmas que llegan.'],
    ['No me llegan los avisos, ¿qué reviso?',
      '- En **iPhone o iPad**, primero instala la aplicación en la pantalla de inicio y ábrela desde el ícono.\n- Si dice **Bloqueados**, permite las notificaciones del sitio en la configuración del navegador o del teléfono.\n- Revisa que el modo **No molestar** o el ahorro de batería no estén silenciando la aplicación.\n- Desactiva y vuelve a activar los avisos, y envía un aviso de prueba.'],
  ] },
  { id: 'cuenta', ilus: 'n_perfil', ico: 'circle-user', titulo: 'Mi cuenta', preguntas: [
    ['¿Cómo cambio mi contraseña o mi foto?',
      'La **fotografía** solo la cambian los **administradores** (en Mi perfil o en Usuarios); si necesitas actualizar la tuya, pídeselo a uno. En **Cambiar contraseña** escribe la nueva dos veces (mínimo 8 caracteres). La contraseña **aplica a todas las aplicaciones** de Pet\'s Table que usan tu cuenta.'],
    ['¿Puedo usar el modo oscuro o la pantalla completa?',
      'Sí. En **Mi perfil → Apariencia** elige Claro, Oscuro o Sistema (también con el botón de sol y luna de la barra superior). En la aplicación instalada en computadora puedes usar el botón de **pantalla completa**.'],
    ['¿Cómo doy acceso a una persona? (administradores)',
      'En **Usuarios** toca **Agregar usuario**, busca la cuenta de Pet\'s Table de la persona, asígnale puesto, rol y departamento, y guarda. Al desactivar a alguien solo pierde el acceso a Metrología; sus demás aplicaciones no se afectan.'],
    ['¿Cerrar sesión afecta mis otras aplicaciones?',
      'No. **Salir** cierra la sesión solo en este dispositivo y en Metrología; el dispositivo deja de recibir tus avisos hasta que vuelvas a entrar.'],
  ] },

// ---------------- Instalación ----------------
const C = { navy: '#0B1E2D', navy2: '#1D4260', orange: '#7E22CE', orangeSoft: '#E9D5FF', turq: '#0FA3A6', bg: '#F4F7FA', line: '#D5DEE6', muted: '#8A99A8', txt: '#1F2D3A', white: '#FFFFFF' };
const URL_APP = 'metrologia-petstable.vercel.app';
const appIcon = () => document.querySelector('img.app-icon')?.src || '';

const T = (x, y, s, size = 9, fill = C.txt, weight = 400, anchor = 'start') =>
  `<text x="${x}" y="${y}" font-family="Arial, Helvetica, sans-serif" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}">${esc(s)}</text>`;
const anillo = (cx, cy, r = 13) => `<circle cx="${cx}" cy="${cy}" r="${r + 7}" fill="${C.orange}" opacity=".16"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${C.orange}" stroke-width="3"/>`;
// v8.2: mismo estilo que las ilustraciones del sistema (cuerpo con degradado de dos tonos, contorno, sombra y brillo)
const DEFS = `<defs><linearGradient id="ins-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A4D69"/><stop offset="1" stop-color="#0B1E2D"/></linearGradient><linearGradient id="ins-p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E8EEF5"/></linearGradient><filter id="ins-s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity=".26"/></filter></defs>`;
// Cada SVG lleva sus propios id (si se repiten, los de una pestaña oculta anulan el degradado)
let nSvg = 0;
const svg = (body) => { const k = `ins${++nSvg}-`; return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 300" width="240" height="300">${(DEFS + body).replace(/ins-/g, k)}</svg>`; };
// Teléfono con pantalla (x 51–189, y 16–284)
const telefono = (pantalla) => svg(`<rect x="44" y="6" width="152" height="288" rx="26" fill="url(#ins-b)" stroke="#06121C" stroke-width="1.4" filter="url(#ins-s)"/><path d="M50 40c0-14 4-26 18-28" stroke="#FFF" stroke-opacity=".3" stroke-width="2.4" fill="none" stroke-linecap="round"/><rect x="51" y="16" width="138" height="268" rx="18" fill="${C.bg}"/>
  <rect x="100" y="21" width="40" height="7" rx="3.5" fill="${C.navy}"/>${pantalla}`);

  <rect x="66" y="${y0 + 32}" width="148" height="${188 - y0 - 36}" rx="3" fill="${C.white}"/>`;

function htmlRespuesta(txt) {
  const fmt = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  let html = '', lista = [];
  const cerrar = () => { if (lista.length) { html += `<ul>${lista.map((l) => `<li>${fmt(l)}</li>`).join('')}</ul>`; lista = []; } };
  txt.split('\n').forEach((l) => { if (l.startsWith('- ')) lista.push(l.slice(2)); else { cerrar(); html += `<p>${fmt(l)}</p>`; } });
  cerrar();
  return html;
}

function filtrar(texto) {
  const t = norm(texto.trim());
  let visibles = 0;
  root.querySelectorAll('.faq-sec').forEach((sec) => {
    if (sec.classList.contains('faq-instalar')) { const ok = !t || sec.dataset.texto.includes(t); sec.classList.toggle('hidden', !ok); visibles += ok; return; }
    let n = 0;
    sec.querySelectorAll('.faq-item').forEach((it) => {
      const ok = !t || it.dataset.texto.includes(t);
      it.classList.toggle('hidden', !ok);
      it.open = !!t && ok;
      n += ok;
    });
    sec.classList.toggle('hidden', !n);
    visibles += n;
  });
  root.querySelector('#faq-vacio').classList.toggle('hidden', visibles > 0);
}

// ---------------- Guía en PDF ----------------
async function svgAPng(svgTxt, escala = 3) {
  const img = new Image();
  img.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svgTxt)}`;
  await img.decode();
  const c = document.createElement('canvas');
  c.width = 240 * escala; c.height = 300 * escala;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/png');
}
async function imagenAPng(src) {
  if (!src) return null;
  const img = new Image(); img.src = src; await img.decode();
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext('2d').drawImage(img, 0, 0);
  return c.toDataURL('image/png');
}

// Las fuentes estándar del PDF solo tienen Latin-1: se sustituyen los símbolos que no existen
const pdfTxt = (s) => s.replace(/→/g, '>').replace(/⋮/g, '(tres puntos)').replace(/⋯/g, '(...)').replace(/…/g, '...').replace(/[–—]/g, '-');

}

  const email = $('#login-email').value.trim();
  await openModal({
    title: 'Restablecer contraseña',
    subtitle: 'Te enviaremos un enlace a tu correo corporativo.',
    size: 'sm', submitText: 'Enviar enlace', confirmDiscard: false,
    body: `<div class="field"><label for="fp-email">Correo corporativo <span class="req">*</span></label>
      <input id="fp-email" name="email" type="email" required maxlength="120" value="${esc(email)}" placeholder="nombre@petstable.mx"></div>
      <p class="hint">Esta contraseña es la misma de tu cuenta Pet's Table en las demás aplicaciones.</p>`,
    onSubmit: async ({ form }) => {
      if (!checkForm(form, { email: (v) => (/@petstable\.mx$/i.test(v) ? '' : 'Usa tu correo @petstable.mx.') })) return false;
      const { error } = await sb.auth.resetPasswordForEmail(form.email.value.trim().toLowerCase(), { redirectTo: `${location.origin}${BASE}` });
      if (error) throw error;
      toast('Si el correo está registrado, recibirás un enlace para restablecer tu contraseña.', 'success', 7000);
    },
  });
}

async function recoveryFlow() {
  hideSplash();
  $('#login').classList.remove('hidden');
  await openModal({
    title: 'Define tu nueva contraseña', size: 'sm', submitText: 'Guardar contraseña', confirmDiscard: false,
    body: `<div class="field"><label for="np1">Nueva contraseña <span class="req">*</span></label>
        <input id="np1" name="p1" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div>
      <div class="field"><label for="np2">Confirmar contraseña <span class="req">*</span></label>
        <input id="np2" name="p2" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div>
      <p class="hint">Mínimo 8 caracteres. Combina letras, números y símbolos.</p>`,
    onSubmit: async ({ form }) => {
      if (!checkForm(form, { p2: (v, f) => (v !== f.p1.value ? 'Las contraseñas no coinciden.' : '') })) return false;
      const { error } = await sb.auth.updateUser({ password: form.p1.value });
      if (error) throw error;
      toast('Contraseña actualizada.', 'success');
    },
  });
  history.replaceState(null, '', location.pathname);
  const { data } = await sb.auth.getSession();
  if (data.session) { state.session = data.session; await loadProfileAndStart(); } else showLogin();
}

// Si la sesión inicial no dispara eventos (p. ej. sin sesión guardada), mostrar login
setTimeout(async () => {
  if (!$('#splash').classList.contains('hidden')) {
    const { data } = await sb.auth.getSession();
    if (!data.session) showLogin();
  }
}, 2500);


Object.assign(__exp, { setTheme });
return __exp;
})();
})();</script>
